<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Visualize — lora-universal-simulator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'SF Mono', 'Consolas', 'Menlo', monospace; font-size: 12px; background: #f5f5f8; color: #2a2a3e; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
#toolbar { display: flex; align-items: center; gap: 12px; padding: 6px 12px; background: #ffffff; border-bottom: 1px solid #d1d5db; flex-shrink: 0; z-index: 10; }
#toolbar label { color: #6b7280; font-size: 11px; }
#toolbar select, #toolbar input { background: #ffffff; color: #2a2a3e; border: 1px solid #d1d5db; padding: 3px 6px; font-size: 11px; font-family: inherit; border-radius: 3px; }
#toolbar .sep { width: 1px; height: 20px; background: #d1d5db; }
#toolbar .info { color: #6b7280; font-size: 11px; }
#toolbar button { background: #e5e7eb; color: #374151; border: 1px solid #d1d5db; padding: 3px 10px; font-size: 11px; font-family: inherit; border-radius: 3px; cursor: pointer; }
#toolbar button:hover { background: #d1d5db; }
#toolbar button.active { background: #3b82f6; border-color: #2563eb; color: #fff; }
#main { display: flex; flex: 1; overflow: hidden; }
#sidebar-resizer { width: 0; cursor: col-resize; background: #d1d5db; flex-shrink: 0; transition: width 0.2s, background 0.15s; position: relative; }
#sidebar-resizer.shown { width: 6px; }
#sidebar-resizer:hover, #sidebar-resizer.dragging { background: #2563eb; }
#sidebar-resizer::after { content: ''; position: absolute; top: 50%; left: 1px; transform: translateY(-50%); height: 32px; width: 4px; border-left: 1px solid rgba(0,0,0,0.15); border-right: 1px solid rgba(0,0,0,0.15); pointer-events: none; }
#sidebar { width: 0; background: #ffffff; border-left: 1px solid #d1d5db; overflow-y: auto; transition: width 0.2s; flex-shrink: 0; }
#sidebar.open { width: 480px; }
#sidebar.dragging { transition: none; }
#sidebar-content { padding: 10px; min-width: 0; }
#sidebar h3 { color: #2563eb; margin: 8px 0 4px; font-size: 12px; }
#sidebar .field { margin: 2px 0; }
#sidebar .field .key { color: #6b7280; }
#sidebar .field .val { color: #2a2a3e; }
#sidebar .pkt-link { color: #2563eb; cursor: pointer; text-decoration: underline; }
#sidebar .pkt-link:hover { color: #1d4ed8; }
#sidebar .json-block {
    margin: 4px 0 8px;
    padding: 6px 8px;
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 4px;
    color: #111827;
    font-size: 11px;
    line-height: 1.35;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
#sidebar .action-row { margin: 8px 0; display: flex; gap: 6px; flex-wrap: wrap; }
#sidebar .action-row button {
    background: #e5e7eb;
    color: #374151;
    border: 1px solid #d1d5db;
    padding: 3px 10px;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
}
#sidebar .action-row button:hover { background: #d1d5db; }
#sidebar table { border-collapse: collapse; width: 100%; margin: 4px 0; }
#sidebar td, #sidebar th { padding: 2px 6px; text-align: left; font-size: 11px; }
#sidebar th { color: #6b7280; border-bottom: 1px solid #d1d5db; }
#sidebar td { border-bottom: 1px solid #e5e7eb; }
#canvas-wrap { flex: 1; position: relative; overflow: hidden; }
canvas { display: block; }
#tooltip { position: absolute; display: none; background: #ffffffee; border: 1px solid #d1d5db; padding: 6px 10px; border-radius: 4px; font-size: 11px; pointer-events: none; z-index: 20; max-width: 400px; white-space: pre-wrap; color: #2a2a3e; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
#time-display { position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%); background: #ffffffcc; padding: 4px 12px; border-radius: 4px; font-size: 13px; color: #2563eb; z-index: 5; pointer-events: none; border: 1px solid #d1d5db; }
#loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: #ffffffee; border: 1px solid #d1d5db; border-radius: 6px;
    padding: 14px 22px; font-size: 14px; color: #2a2a3e; z-index: 30;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    pointer-events: none;
}
#loading::before {
    content: ''; display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid #d1d5db; border-top-color: #2563eb; border-radius: 50%;
    animation: lus-spin 0.8s linear infinite;
}
@keyframes lus-spin { to { transform: rotate(360deg); } }
#loading.busy-fetch {
    /* Smaller pill in the bottom-right for re-fetches during pan/zoom
       so it doesn't block the data the user is trying to look at. */
    top: auto; left: auto; bottom: 50px; right: 16px; transform: none;
    padding: 6px 12px; font-size: 11px;
}
#scrollbar { display: flex; align-items: center; gap: 6px; padding: 4px 12px; background: #ffffff; border-top: 1px solid #d1d5db; flex-shrink: 0; }
#scrollbar input[type=range] { flex: 1; height: 16px; -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
#scrollbar input[type=range]::-webkit-slider-runnable-track { height: 6px; background: #d1d5db; border-radius: 3px; }
#scrollbar input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: #3b82f6; border-radius: 50%; margin-top: -6px; border: 2px solid #60a5fa; }
#scrollbar input[type=range]::-moz-range-track { height: 6px; background: #d1d5db; border-radius: 3px; border: 0; }
#scrollbar input[type=range]::-moz-range-thumb { width: 14px; height: 14px; background: #3b82f6; border-radius: 50%; border: 2px solid #60a5fa; }
#scrollbar button { background: #e5e7eb; color: #374151; border: 1px solid #d1d5db; padding: 2px 8px; font-size: 12px; font-family: inherit; border-radius: 3px; cursor: pointer; min-width: 28px; }
#scrollbar button:hover { background: #d1d5db; }
#scrollbar .scroll-time { color: #6b7280; font-size: 11px; min-width: 80px; text-align: center; }
@keyframes pulse-live { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
</style>
</head>
<body>

<div id="toolbar">
    <a href="/static/simulations.html" style="color:#2563eb;text-decoration:none;margin-right:8px;">&larr; Back</a>
    <label>Nodes:</label>
    <select id="node-order">
        <option value="role">By role + name</option>
        <option value="alpha">Alphabetical</option>
        <option value="lat">By latitude</option>
        <option value="activity">By activity</option>
        <option value="trace">By trace</option>
    </select>
    <div class="sep"></div>
    <label>Filter:</label>
    <input id="node-filter" type="text" placeholder="node name..." style="width:120px">
    <input id="type-filter" type="text" placeholder="event types: tx,rx,..."
           title="Comma-separated event types to show (empty = all). Prefix a type with ! to hide it instead. Example: tx,rx — show only those; !script_log — hide script_log."
           style="width:180px">
    <div class="sep"></div>
    <button id="btn-zoom-fit" title="Fit all">Fit</button>
    <button id="btn-trace-mode" title="Click packets to trace">Trace</button>
    <button id="btn-rays" title="Show TX→RX propagation lines">Rays</button>
    <button id="btn-delivery" title="Per-DM / per-channel delivery breakdown">Delivery</button>
    <div class="sep"></div>
    <label>Go to:</label>
    <input id="goto-ms" type="text" placeholder="ms (or 1:30 / 30s)" style="width:140px"
           title="Jump viewport center to a time. Accepts raw ms (12345), seconds (30s), or m:ss (1:30).">
    <button id="btn-goto" title="Center viewport on time (Enter)">Go</button>
    <div class="sep"></div>
    <span id="info-text" class="info"></span>
    <span id="follow-indicator" style="display:none;background:#dc2626;color:#fff;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700;animation:pulse-live 1.5s ease infinite">LIVE</span>
    <span style="flex:1"></span>
    <span id="viewport-info" class="info"></span>
</div>

<div id="main">
    <div id="canvas-wrap">
        <canvas id="canvas"></canvas>
        <div id="tooltip"></div>
        <div id="time-display"></div>
        <div id="loading">Loading...</div>
    </div>
    <div id="sidebar-resizer" title="Drag to resize trace panel"></div>
    <div id="sidebar">
        <div id="sidebar-content"></div>
    </div>
</div>
<div id="scrollbar">
    <button id="btn-zoom-in" title="Zoom in">+</button>
    <button id="btn-zoom-out" title="Zoom out">&minus;</button>
    <span class="scroll-time" id="scroll-from"></span>
    <input type="range" id="time-slider" min="0" max="1000" value="0">
    <span class="scroll-time" id="scroll-to"></span>
</div>

<script>
// Get sim ID from URL params: visualize.html?id=abc123 or ?interactive=abc123
const _params = new URLSearchParams(window.location.search);
const SIM_ID = _params.get('id');
const INTERACTIVE_ID = _params.get('interactive');
const API_PREFIX = INTERACTIVE_ID
    ? `/api/interactive/${INTERACTIVE_ID}`
    : `/api/sims/${SIM_ID}`;
const IS_IFRAME = window.parent !== window;
let followMode = !!INTERACTIVE_ID;  // auto-follow in interactive mode

if (!SIM_ID && !INTERACTIVE_ID) {
    document.getElementById('loading').textContent = 'Error: No simulation ID. Use ?id=ID';
}

// ── State ──────────────────────────────────────────────────────
const S = {
    meta: null,
    events: [],
    nodes: [],           // ordered node list for display
    nodeIndex: {},       // name -> index in nodes[]
    idToName: {},        // runtime registration id -> canonical name
    nodeFilter: new Set(),
    // Event-type filter parsed from the toolbar's #type-filter input.
    // Empty input = no filter (show all). Comma-separated list:
    //   - bare types (e.g. `tx,rx`)        → whitelist (only those)
    //   - prefixed with `!` (e.g. `!script_log`) → blacklist (hide those)
    // Mixed allow/deny in one input is supported; deny takes priority.
    typeFilterAllow: null,   // Set<string> | null  (null = no whitelist)
    typeFilterDeny: new Set(),

    // Viewport (in simulation time ms)
    viewFrom: 0,
    viewTo: 10000,

    // Canvas layout
    laneH: 24,
    labelW: 220,
    headerH: 30,

    // Vertical scroll (node lanes)
    scrollY: 0,          // pixels scrolled down
    maxScrollY: 0,       // computed from node count vs canvas height

    // Rendered viewport snapshot (for hit-testing against what user actually sees)
    renderedViewFrom: 0,
    renderedViewTo: 10000,
    renderedScrollY: 0,

    // Interaction
    dragging: false,
    dragMoved: false,
    dragStartX: 0,
    dragStartY: 0,
    dragViewFrom: 0,
    dragScrollY: 0,
    traceMode: false,
    raysMode: false,
    tracePkt: null,
    traceEvents: [],
    // Flight trace: same machinery as tracePkt but matched by the
    // (origin, payload) tuple that scripts emit on every flight-related
    // script_emit. Lights up the whole RTS-CTS-DATA-ACK chain across all
    // hops including retries (rts_retry, path_switch, NACK, etc.) — i.e.
    // every event tagged with the same originator + payload bytes.
    traceFlight: null,            // { origin: int, payload: string } | null
    traceFlightEventSet: null,    // Set of references to matching script_emit events
    traceHopDepth: null,
    hoveredEvent: null,
    selectedEvent: null,

    // Cached data
    cachedFrom: -1,
    cachedTo: -1,
    cachedEvents: [],
    densityCache: null,

    // Sub-row layout for SF/BW orthogonality. Computed once per
    // events-load by computeSubRowLayout(). Empty -> single-row
    // fallback (legacy events without sf/bw_hz).
    subRows: [],          // [{sf, bw_hz}, ...]  ordered ascending by sf, then bw_hz
    subRowIndex: new Map(),  // "sf|bw_hz" -> index into subRows

    // Playback cursor — set by mlv-cursor-time / mlv-scrub-time postMessage
    // from the parent map_live.html. null = no cursor (standalone view or
    // before the first message arrives).
    cursorMs: null,

    // Node activity counts (for sorting)
    nodeActivity: {},

    // Saved sort order before trace auto-switch
    preTraceOrder: null,
};

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const timeDisplay = document.getElementById('time-display');
const loading = document.getElementById('loading');
const sidebar = document.getElementById('sidebar');
const sidebarContent = document.getElementById('sidebar-content');

// When embedded as map_live.html's bottom-strip iframe, the
// time-display overlay covers part of the swim-lane area the user
// wants to inspect. Hide it in iframe mode — the parent already shows
// time context via its own status bar + the playback cursor label.
if (IS_IFRAME) {
    timeDisplay.style.display = 'none';
}

// Saturated palette tuned for the light lane background (#f0f0f4).
// Pastel hues wash out almost entirely; these tones keep contrast.
const COLORS = {
    sim_start:        '#4338ca',  // indigo-700
    sim_end:          '#4338ca',
    node_ready:       '#15803d',  // green-700
    tx:               '#2563eb',  // blue-600   — sender block
    rx:               '#16a34a',  // green-600  — receiver bar
    drop_weak:        '#f97316',  // orange-500 — too weak to decode
    drop_sf_mismatch: '#ca8a04',  // yellow-600  — receiver on wrong SF (ignored)
    drop_halfduplex:  '#be123c',  // rose-700   — receiver was transmitting
    collision:        '#dc2626',  // red-600    — interferer destroyed the packet
    tx_deferred:      '#f59e0b',  // amber-500
    cmd_reply:        '#64748b',  // slate-500
    script_log:       '#b45309',  // amber-700  — visible on light bg
    script_emit:      '#0891b2',  // cyan-600
    node_stats:       '#475569',  // slate-600
    trace_highlight: '#ca8a04',
    lane_bg: '#f0f0f4',
    lane_bg_alt: '#e8e8ef',
    lane_border: '#d1d5db',
    text: '#666666',
    time_grid: '#d1d5db',
    time_text: '#999999',
};

// ── Data loading ───────────────────────────────────────────────
async function fetchJSON(url) {
    const r = await fetch(url);
    return r.json();
}

async function init() {
    loading.textContent = 'Loading sim metadata…';
    loading.style.display = '';
    S.meta = await fetchJSON(`${API_PREFIX}/meta`);
    S.idToName = S.meta.id_to_name || {};
    document.getElementById('info-text').textContent =
        `${S.meta.nodes.length} nodes, ${S.meta.event_count} events, ` +
        `${((S.meta.time_max - S.meta.time_min) / 1000).toFixed(1)}s`;

    S.nodes = [...S.meta.nodes];
    // Count activity per node from stats
    for (const st of S.meta.stats || []) {
        S.nodeActivity[st.node] = (st.sent_flood || 0) + (st.sent_direct || 0) +
            (st.recv_direct || 0) + (st.recv_group || 0);
    }
    for (const st of S.meta.repeater_stats || []) {
        if (st.stats_type === 'packets' && st.data) {
            S.nodeActivity[st.node] = (S.nodeActivity[st.node] || 0) + (st.data.recv || 0) + (st.data.sent || 0);
        }
    }
    sortNodes();

    if (INTERACTIVE_ID) {
        // Interactive mode: keep NOW at ~80% from left, 20% future
        interactiveFollowViewport(S.meta.time_max);
    } else {
        S.viewFrom = S.meta.time_min;
        S.viewTo = Math.min(S.meta.time_min + 30000, S.meta.time_max);
    }

    loading.textContent = 'Loading events…';
    resize();
    await loadViewport();
    loading.style.display = 'none';
    render();

    // Interactive mode: start polling for new events
    if (INTERACTIVE_ID) {
        startInteractivePoll();
    }
}

// ── Interactive viewport ─────────────────────────────────────────
// Position NOW at ~80% from the left, with ~20% future visible.
// Span stays stable (doesn't grow to fit all data), giving a scrolling-window feel.
function interactiveFollowViewport(nowMs) {
    let span = S.viewTo - S.viewFrom;
    // On first call or zero span, pick a sensible default
    if (span <= 0) span = 10000;
    // Keep ~20% of the viewport as future past NOW (never less than 500ms)
    const futureMs = Math.max(500, span * 0.2);
    S.viewTo = nowMs + futureMs;
    S.viewFrom = S.viewTo - span;
    // Don't scroll before time_min — widen the window instead
    if (S.viewFrom < S.meta.time_min) {
        S.viewFrom = S.meta.time_min;
        S.viewTo = S.viewFrom + span;
    }
}

function startInteractivePoll() {
    let failCount = 0;
    const iv = setInterval(async () => {
        try {
            const m = await fetchJSON(`${API_PREFIX}/meta`);
            failCount = 0;
            if (m.time_max > S.meta.time_max || m.event_count > S.meta.event_count) {
                const oldNodes = S.meta.nodes;
                S.meta = m;
                S.idToName = S.meta.id_to_name || {};
                // If new nodes appeared, rebuild node list
                if (m.nodes.length !== oldNodes.length) {
                    S.nodes = [...m.nodes];
                    sortNodes();
                }
                // Follow mode: keep NOW at ~80% from left
                if (followMode) {
                    interactiveFollowViewport(m.time_max);
                }
                // Invalidate cache so loadViewport re-fetches
                S.cachedFrom = -1;
                S.cachedTo = -1;
                await loadViewport();
                render();
                syncScrollbar();
                updateFollowIndicator();
            }
        } catch (e) {
            failCount++;
            if (e.message && e.message.startsWith('404')) {
                clearInterval(iv);
                console.warn('Interactive session gone, stopped polling');
            } else if (failCount >= 5) {
                clearInterval(iv);
                console.warn('Too many polling failures, stopped polling');
            }
        }
    }, 2000);
}

// Listen for parent iframe messages to update immediately (no polling delay)
if (INTERACTIVE_ID) {
    window.addEventListener('message', async (e) => {
        if (!e.data || e.data.type !== 'timeUpdate') return;
        const newTime = e.data.time_ms;
        if (newTime > S.meta.time_max) {
            S.meta.time_max = newTime;
            S.meta.event_count = (e.data.event_count != null) ? e.data.event_count : S.meta.event_count;
        }
        if (followMode) {
            interactiveFollowViewport(S.meta.time_max);
        }
        S.cachedFrom = -1;
        S.cachedTo = -1;
        await loadViewport();
        render();
        syncScrollbar();
        updateFollowIndicator();
        // Auto-refresh trace to pick up new relay hops / new flight events
        if (S.tracePkt) {
            await tracePkt(S.tracePkt);
        } else if (S.traceFlight) {
            await traceFlight(S.traceFlight.origin, S.traceFlight.payload);
        }
    });
}

function updateFollowIndicator() {
    const el = document.getElementById('follow-indicator');
    if (!el) return;
    el.style.display = followMode ? '' : 'none';
}

function sortNodes() {
    const order = document.getElementById('node-order').value;
    const filter = document.getElementById('node-filter').value.toLowerCase();

    let nodes = [...S.meta.nodes];
    if (order === 'role') {
        nodes.sort((a, b) => {
            // companions first, then repeaters, alpha within
            const ca = a.role === 'companion' ? 0 : 1;
            const cb = b.role === 'companion' ? 0 : 1;
            if (ca !== cb) return ca - cb;
            return a.name.localeCompare(b.name);
        });
    } else if (order === 'alpha') {
        nodes.sort((a, b) => a.name.localeCompare(b.name));
    } else if (order === 'lat') {
        nodes.sort((a, b) => (b.lat || 0) - (a.lat || 0));
    } else if (order === 'activity') {
        nodes.sort((a, b) => (S.nodeActivity[b.name] || 0) - (S.nodeActivity[a.name] || 0));
    } else if (order === 'trace') {
        if (S.traceEvents && S.traceEvents.length > 0) {
            // Build map of node -> earliest appearance time from trace events
            const earliest = {};
            for (const ev of S.traceEvents) {
                const names = [];
                if (ev.node) names.push(ev.node);
                if (ev.from) names.push(ev.from);
                if (ev.to) names.push(ev.to);
                for (const n of names) {
                    if (!(n in earliest) || ev.time_ms < earliest[n]) {
                        earliest[n] = ev.time_ms;
                    }
                }
            }
            nodes.sort((a, b) => {
                const aIn = a.name in earliest;
                const bIn = b.name in earliest;
                if (aIn && bIn) return earliest[a.name] - earliest[b.name];
                if (aIn) return -1;
                if (bIn) return 1;
                return a.name.localeCompare(b.name);
            });
        } else {
            // No active trace — fall back to role sort
            nodes.sort((a, b) => {
                const ca = a.role === 'companion' ? 0 : 1;
                const cb = b.role === 'companion' ? 0 : 1;
                if (ca !== cb) return ca - cb;
                return a.name.localeCompare(b.name);
            });
        }
    }

    // Apply filter
    if (filter) {
        nodes = nodes.filter(n => n.name.toLowerCase().includes(filter));
    }

    S.nodes = nodes;
    S.nodeIndex = {};
    nodes.forEach((n, i) => S.nodeIndex[n.name] = i);
}

// Show a small busy pill on every fetch — the pill reflects "we're
// loading new events for the new viewport." Multi-call safe via a
// counter so concurrent pan+zoom doesn't flicker.
let _viewportFetchDepth = 0;
let _viewportFetchTimer = null;
function _viewportFetchStart(label) {
    _viewportFetchDepth++;
    if (_viewportFetchTimer) return;
    // Delay before showing — fetches that finish in <120ms shouldn't
    // flash the indicator.
    _viewportFetchTimer = setTimeout(() => {
        if (_viewportFetchDepth > 0) {
            loading.textContent = label;
            loading.classList.add('busy-fetch');
            loading.style.display = '';
        }
    }, 120);
}
function _viewportFetchEnd() {
    _viewportFetchDepth = Math.max(0, _viewportFetchDepth - 1);
    if (_viewportFetchDepth > 0) return;
    if (_viewportFetchTimer) { clearTimeout(_viewportFetchTimer); _viewportFetchTimer = null; }
    loading.style.display = 'none';
    loading.classList.remove('busy-fetch');
}

async function loadViewport() {
    const span = S.viewTo - S.viewFrom;
    _viewportFetchStart(span > 60000 ? 'Loading density…' : 'Loading events…');
    try {
    // Use density mode for large spans
    if (span > 60000) {
        const bucketMs = Math.max(100, Math.round(span / canvas.width));
        S.densityCache = await fetchJSON(
            `${API_PREFIX}/density?from=${Math.floor(S.viewFrom)}&to=${Math.ceil(S.viewTo)}&bucket=${bucketMs}`);
        S.cachedEvents = [];
    } else {
        S.densityCache = null;
        // Avoid re-fetching if viewport is within cache
        if (S.viewFrom >= S.cachedFrom && S.viewTo <= S.cachedTo && S.cachedEvents.length > 0) {
            return;
        }
        // Fetch with margin for smooth panning. max= is bumped well
        // above the server's 20k default so we don't silently subsample
        // events for dense sims (e.g. s02 at ~1100 events/s × 90s
        // margin-extended span = ~100k events; default would drop 80%).
        // Density mode (span > 60s, handled above) is the right answer
        // for truly large spans; here we want full fidelity.
        const margin = span * 0.5;
        const from = Math.max(0, Math.floor(S.viewFrom - margin));
        const to = Math.ceil(S.viewTo + margin);
        const data = await fetchJSON(
            `${API_PREFIX}/events?from=${from}&to=${to}&max=500000`);
        S.cachedEvents = data.events;
        S.cachedFrom = from;
        S.cachedTo = to;
        // pkt -> tx event index, for propagating label/info to rx/drop bars
        // sharing the same packet hash.
        S.txByPkt = {};
        for (const ev of S.cachedEvents) {
            if (ev.type === 'tx' && ev.pkt) S.txByPkt[ev.pkt] = ev;
        }
    }
    computeSubRowLayout();
    } finally {
        _viewportFetchEnd();
    }
}

// ── Rendering ──────────────────────────────────────────────────
function resize() {
    const wrap = document.getElementById('canvas-wrap');
    canvas.width = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
    updateMaxScrollY();
}

function msToX(ms) {
    return S.labelW + (ms - S.viewFrom) / (S.viewTo - S.viewFrom) * (canvas.width - S.labelW);
}

function xToMs(x) {
    return S.viewFrom + (x - S.labelW) / (canvas.width - S.labelW) * (S.viewTo - S.viewFrom);
}

// Clamp viewport so viewFrom never goes below time_min.
// When the viewport span exceeds the data range, anchor at time_min.
// In interactive mode, allow viewTo to extend past time_max (for NOW margin).
function clampViewport() {
    const span = S.viewTo - S.viewFrom;
    const range = S.meta.time_max - S.meta.time_min;
    if (span >= range) {
        // Viewport wider than data — just show from time_min
        S.viewFrom = S.meta.time_min;
        S.viewTo = S.viewFrom + span;
    } else {
        if (S.viewFrom < S.meta.time_min) {
            S.viewFrom = S.meta.time_min;
            S.viewTo = S.viewFrom + span;
        }
        // In interactive mode, don't clamp viewTo to time_max —
        // interactiveFollowViewport intentionally extends past it for margin
        if (!INTERACTIVE_ID && S.viewTo > S.meta.time_max) {
            S.viewTo = S.meta.time_max;
            S.viewFrom = S.viewTo - span;
        }
    }
}

// Pre-scan cached events for unique (sf, bw_hz) tuples. Called whenever
// new events arrive (i.e. after loadViewport refills S.cachedEvents).
// The result is stable across re-renders within a sim.
function computeSubRowLayout() {
    const seen = new Map();
    for (const ev of S.cachedEvents) {
        if (typeof ev.sf !== 'number' || typeof ev.bw_hz !== 'number') continue;
        const key = ev.sf + '|' + ev.bw_hz;
        if (!seen.has(key)) seen.set(key, { sf: ev.sf, bw_hz: ev.bw_hz });
    }
    // Sort: SF ascending, BW ascending within SF
    const arr = Array.from(seen.values())
        .sort((a, b) => (a.sf - b.sf) || (a.bw_hz - b.bw_hz));
    S.subRows = arr;
    S.subRowIndex = new Map(arr.map((r, i) => [r.sf + '|' + r.bw_hz, i]));
}

// Map an event to its sub-row index. Returns 0 for events without
// sf/bw_hz (legacy fallback) or with an SF/BW combo not seen during
// the layout pre-scan.
function subRowFor(ev) {
    if (S.subRows.length === 0) return 0;
    if (typeof ev.sf !== 'number' || typeof ev.bw_hz !== 'number') return 0;
    const key = ev.sf + '|' + ev.bw_hz;
    const idx = S.subRowIndex.get(key);
    return (idx == null) ? 0 : idx;
}

// Returns the pixel Y of the TOP of the sub-row for a given node name.
// If ev is provided, the sub-row offset for that event's (sf, bw_hz) is added.
// Without ev, returns the top of the node group (sub-row 0).
function nodeToY(name, ev) {
    // tx/rx events use the canonical string name ("alice"); script_log /
    // script_emit / cmd_reply use the integer registration id (lus assigns
    // 0..N-1 in JSON-config order). Resolve through metadata first because
    // S.nodes is user-sortable and no longer necessarily matches runtime id
    // order.
    const nodeName = nodeIdToName(name);
    const idx = nodeName != null ? S.nodeIndex[nodeName] : undefined;
    if (idx === undefined) return null;
    const subRowCount = Math.max(1, S.subRows.length);
    const nodeLaneH = S.laneH * subRowCount;
    const subRowIdx = ev ? subRowFor(ev) : 0;
    return S.headerH + idx * nodeLaneH + subRowIdx * S.laneH - S.scrollY;
}

// Coerce a possibly-integer node identifier to the canonical string name.
// Used by the hit-test path so a click on a script_emit diamond can
// be tied back to S.nodes[laneIdx].name.
function nodeIdToName(nodeRef) {
    if (typeof nodeRef === 'number') {
        const mapped = S.idToName && S.idToName[String(nodeRef)];
        if (mapped) return mapped;
        if (nodeRef >= 0 && nodeRef < (S.meta?.nodes?.length || 0)) {
            return S.meta.nodes[nodeRef].name;
        }
        return null;
    }
    return nodeRef;
}

function runtimeIdForName(name) {
    if (!S.idToName) return null;
    for (const [id, nodeName] of Object.entries(S.idToName)) {
        if (nodeName === name) return id;
    }
    return null;
}

function hex32(v) {
    if (v === undefined || v === null) return '';
    const n = Number(v);
    if (!Number.isFinite(n)) return String(v);
    return '0x' + (n >>> 0).toString(16).padStart(8, '0');
}

function shortHex32(v) {
    const h = hex32(v);
    return h ? h.slice(0, 6) + '\u2026' + h.slice(-4) : '';
}

function nodeIdentityLine(node) {
    const parts = [];
    if (node.node_id !== undefined && node.node_id !== null) parts.push(`id=${node.node_id}`);
    if (node.layer_id !== undefined && node.layer_id !== null) parts.push(`L${node.layer_id}`);
    if (node.leaf_id !== undefined && node.leaf_id !== null) parts.push(`leaf=${node.leaf_id}`);
    if (node.key_hash32 !== undefined && node.key_hash32 !== null) parts.push(shortHex32(node.key_hash32));
    return parts.join(' ');
}

function addField(html, key, value) {
    if (value === undefined || value === null || value === '') return html;
    return html + `<div class="field"><span class="key">${escHtml(key)}: </span><span class="val">${escHtml(String(value))}</span></div>`;
}

function isHashField(key) {
    return /(^|_)hash32$/.test(String(key)) || /key_hash/i.test(String(key));
}

function displayValueForKey(key, value) {
    if (isHashField(key) && typeof value === 'number') return hex32(value);
    if (typeof value === 'number') return Number.isInteger(value) ? String(value) : value.toFixed(2);
    return String(value);
}

function normalizeDisplayJson(value, key = '') {
    if (Array.isArray(value)) return value.map(v => normalizeDisplayJson(v));
    if (value && typeof value === 'object') {
        const out = {};
        for (const [k, v] of Object.entries(value)) out[k] = normalizeDisplayJson(v, k);
        return out;
    }
    if (isHashField(key) && typeof value === 'number') return hex32(value);
    return value;
}

function updateMaxScrollY() {
    const subRowCount = Math.max(1, S.subRows.length);
    const nodeLaneH = S.laneH * subRowCount;
    const totalH = S.nodes.length * nodeLaneH;
    const visibleH = canvas.height - S.headerH;
    S.maxScrollY = Math.max(0, totalH - visibleH);
    S.scrollY = Math.min(S.scrollY, S.maxScrollY);
}

function render() {
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Snapshot viewport state for hit-testing (so clicks match what's drawn)
    S.renderedViewFrom = S.viewFrom;
    S.renderedViewTo = S.viewTo;
    S.renderedScrollY = S.scrollY;

    // Background
    ctx.fillStyle = '#f5f5f8';
    ctx.fillRect(0, 0, w, h);

    updateMaxScrollY();

    const nNodes = S.nodes.length;
    const contentW = w - S.labelW;

    // Clip content area below header
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, S.headerH, w, h - S.headerH);
    ctx.clip();

    const subRowCount = Math.max(1, S.subRows.length);
    const nodeLaneH = S.laneH * subRowCount;

    // Draw lanes (with scrollY offset)
    for (let i = 0; i < nNodes; i++) {
        const y = S.headerH + i * nodeLaneH - S.scrollY;
        if (y + nodeLaneH < S.headerH) continue;
        if (y > h) break;
        // Alternate light/dark per node, with sub-row stripes inside
        for (let s = 0; s < subRowCount; s++) {
            const subY = y + s * S.laneH;
            ctx.fillStyle = ((i + s) % 2 === 0) ? COLORS.lane_bg : COLORS.lane_bg_alt;
            ctx.fillRect(S.labelW, subY, contentW, S.laneH);
        }

        // Lane border at the bottom of the node group
        ctx.strokeStyle = COLORS.lane_border;
        ctx.beginPath();
        ctx.moveTo(S.labelW, y + nodeLaneH);
        ctx.lineTo(w, y + nodeLaneH);
        ctx.stroke();
    }

    // Time grid lines in content area
    drawTimeGrid(contentW, h);

    ctx.restore();

    // Label column background (over clipped content)
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, S.headerH, S.labelW, h - S.headerH);

    // Draw labels (clipped to below header)
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, S.headerH, S.labelW, h - S.headerH);
    ctx.clip();
    for (let i = 0; i < nNodes; i++) {
        const y = S.headerH + i * nodeLaneH - S.scrollY;
        if (y + nodeLaneH < S.headerH) continue;
        if (y > h) break;
        const node = S.nodes[i];
        const isCompanion = node.role === 'companion';

        // Node identity: name plus protocol id/layer/hash. Keep this in
        // the lane itself so gateway/debug traces are understandable without
        // opening another tool.
        ctx.fillStyle = isCompanion ? '#2563eb' : '#6b7280';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        const maxNameChars = (S.subRows.length > 0) ? 16 : 28;
        const displayName = node.name.length > maxNameChars
            ? node.name.slice(0, maxNameChars - 1) + '…'
            : node.name;
        const cy = y + nodeLaneH / 2;
        ctx.fillText(displayName, 8, cy - 2);
        const ident = nodeIdentityLine(node);
        if (ident) {
            ctx.font = '9px monospace';
            ctx.fillStyle = '#9ca3af';
            ctx.fillText(ident, 8, cy + 10);
        }

        // Sub-row labels (one per (sf, bw_hz) tuple)
        ctx.font = '9px monospace';
        ctx.fillStyle = '#9ca3af';
        ctx.textBaseline = 'middle';
        for (let s = 0; s < subRowCount; s++) {
            const sub = S.subRows[s];
            if (!sub) continue;  // single-row fallback, no label
            const subY = y + s * S.laneH + S.laneH / 2;
            const label = 'SF' + sub.sf + '/' + Math.round(sub.bw_hz / 1000) + 'k';
            ctx.fillText(label, 150, subY);
        }
    }
    ctx.restore();

    // Header background + time axis
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, S.headerH);
    // Header bottom border
    ctx.strokeStyle = '#d1d5db';
    ctx.beginPath();
    ctx.moveTo(0, S.headerH);
    ctx.lineTo(w, S.headerH);
    ctx.stroke();
    drawTimeAxis(contentW);

    // Draw events (clipped to content area)
    ctx.save();
    ctx.beginPath();
    ctx.rect(S.labelW, S.headerH, w - S.labelW, h - S.headerH);
    ctx.clip();

    drawWarmupOverlay(h);

    if (S.densityCache) {
        drawDensity();
    } else {
        drawEvents();
    }

    // Flight trace polyline always shows when a flight is active —
    // independent of the rays toggle. Rays (per-packet TX→RX) still
    // gate on raysMode; the polyline is the higher-level flow view.
    if (S.traceFlight && S.traceEvents.length) {
        drawFlightPolyline();
    }

    // Draw trace overlay (rays for both pkt-trace and flight-trace use the
    // same TX→RX matching logic; drawTrace runs whenever there are traced
    // events to anchor)
    if (S.traceEvents.length && (S.tracePkt || S.traceFlight)) {
        drawTrace();
    }

    // Interactive mode: draw "now" line in content area
    if (INTERACTIVE_ID && S.meta) {
        drawNowLine(h);
    }

    // Playback cursor — only meaningful when embedded as an iframe
    // with a parent driving playback (e.g. map_live.html). Standalone
    // visualize.html has no playback context, so skip the cursor
    // entirely there to avoid a stray triangle / time label.
    if (IS_IFRAME) {
        drawCursorLine(h);
    }

    ctx.restore();

    // Interactive mode: draw "NOW" label in header (outside content clip)
    if (INTERACTIVE_ID && S.meta) {
        drawNowLabel();
    }

    // Playback-cursor label in header (outside content clip).
    if (IS_IFRAME) {
        drawCursorLabel();
    }

    // Time display
    const centerMs = (S.viewFrom + S.viewTo) / 2;
    const spanMs = S.viewTo - S.viewFrom;
    timeDisplay.textContent = `${formatTime(S.viewFrom)} \u2014 ${formatTime(S.viewTo)} (${formatDuration(spanMs)})`;

    // Viewport info
    document.getElementById('viewport-info').textContent =
        S.densityCache ? 'density mode' : `${S.cachedEvents.length} events in cache`;

    // Vertical scrollbar indicator (right edge)
    if (S.maxScrollY > 0) {
        const trackH = h - S.headerH;
        const _subRowCount = Math.max(1, S.subRows.length);
        const totalH = S.nodes.length * S.laneH * _subRowCount;
        const thumbH = Math.max(20, trackH * trackH / totalH);
        const thumbY = S.headerH + (S.scrollY / S.maxScrollY) * (trackH - thumbH);
        ctx.fillStyle = '#c4c4c422';
        ctx.fillRect(w - 6, S.headerH, 6, trackH);
        ctx.fillStyle = '#aaaaaa88';
        ctx.fillRect(w - 6, thumbY, 6, thumbH);
    }

    syncScrollbar();
}

function timeTickInterval(contentW) {
    const span = S.viewTo - S.viewFrom;
    const targetTicks = contentW / 100;
    const rawInterval = span / targetTicks;
    const niceIntervals = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000,
                           10000, 20000, 30000, 60000, 120000, 300000, 600000, 1800000, 3600000];
    return niceIntervals.find(n => n >= rawInterval) || rawInterval;
}

function drawTimeGrid(contentW, h) {
    const interval = timeTickInterval(contentW);
    const firstTick = Math.ceil(S.viewFrom / interval) * interval;
    for (let t = firstTick; t <= S.viewTo; t += interval) {
        const x = msToX(t);
        if (x < S.labelW) continue;
        ctx.strokeStyle = COLORS.time_grid;
        ctx.beginPath();
        ctx.moveTo(x, S.headerH);
        ctx.lineTo(x, h);
        ctx.stroke();
    }
}

function drawTimeAxis(contentW) {
    const interval = timeTickInterval(contentW);
    const firstTick = Math.ceil(S.viewFrom / interval) * interval;
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';

    for (let t = firstTick; t <= S.viewTo; t += interval) {
        const x = msToX(t);
        if (x < S.labelW) continue;
        ctx.fillStyle = COLORS.time_text;
        ctx.fillText(formatTime(t), x, 2);
        ctx.fillText(Math.round(t) + 'ms', x, 15);
    }
}

function drawWarmupOverlay(h) {
    if (!S.meta || !S.meta.sim) return;
    // Prefer the warmup_end event's actual time_ms (authoritative,
    // emitted by the C++ runtime when the clock crosses warmup_ms).
    // Fall back to the configured warmup_ms for older runs / during a
    // sim that's still pre-boundary.
    const warmup = (typeof S.meta.sim.warmup_end_ms === 'number')
                 ? S.meta.sim.warmup_end_ms
                 : (S.meta.sim.warmup_ms || 0);
    if (warmup <= 0) return;
    if (warmup <= S.viewFrom) return;  // warmup region not visible

    const x0 = Math.max(msToX(0), S.labelW);
    const x1 = Math.min(msToX(warmup), canvas.width);
    if (x1 <= x0) return;

    // Semi-transparent overlay
    ctx.fillStyle = 'rgba(59, 130, 246, 0.08)';
    ctx.fillRect(x0, 0, x1 - x0, h);

    // Dashed vertical line at warmup boundary
    ctx.strokeStyle = 'rgba(59, 130, 246, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(x1, 0);
    ctx.lineTo(x1, h);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineWidth = 1;

    // Label at top
    const label = S.meta.sim.hot_start ? 'warmup / hot-start' : 'warmup';
    ctx.font = '10px monospace';
    ctx.fillStyle = 'rgba(37, 99, 235, 0.7)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    const labelX = Math.max(x0 + 4, x1 - ctx.measureText(label).width - 6);
    ctx.fillText(label, labelX, 4);
}

function drawNowLine(h) {
    // Draws the vertical "now" line in the content area (called inside content clip)
    const nowMs = S.meta.time_max;
    if (nowMs < S.viewFrom || nowMs > S.viewTo) return;
    const x = msToX(nowMs);
    if (x < S.labelW || x > canvas.width) return;

    ctx.strokeStyle = '#dc2626';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 3]);
    ctx.beginPath();
    ctx.moveTo(x, S.headerH);
    ctx.lineTo(x, h);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineWidth = 1;
}

// Playback cursor — vertical line at S.cursorMs, drawn when the parent
// map_live.html is replaying or has stepped via the Next button. Same
// rendering pattern as drawNowLine but in a contrasting color so it
// can't be confused with the interactive-mode NOW line.
function drawCursorLine(h) {
    if (S.cursorMs == null) return;
    if (S.cursorMs < S.viewFrom || S.cursorMs > S.viewTo) return;
    const x = msToX(S.cursorMs);
    if (x < S.labelW || x > canvas.width) return;

    // Subtle dashed line so it doesn't obscure data behind it. The
    // labeled triangle at the top (drawCursorLabel) carries the
    // "where am I" weight; the line just hints at the column.
    ctx.strokeStyle = '#7c3aed';   // vibrant purple — distinct from red NOW line
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.4;
    ctx.setLineDash([3, 4]);
    ctx.beginPath();
    ctx.moveTo(x, S.headerH);
    ctx.lineTo(x, h);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
}

function drawCursorLabel() {
    if (S.cursorMs == null) return;
    if (S.cursorMs < S.viewFrom || S.cursorMs > S.viewTo) return;
    const x = msToX(S.cursorMs);
    if (x < S.labelW || x > canvas.width) return;

    // Filled triangle pointing down at the top of the content area
    ctx.fillStyle = '#7c3aed';
    ctx.beginPath();
    ctx.moveTo(x, S.headerH);
    ctx.lineTo(x - 5, S.headerH - 7);
    ctx.lineTo(x + 5, S.headerH - 7);
    ctx.closePath();
    ctx.fill();

    // Time label above the triangle (compact: "12.345s")
    ctx.font = 'bold 9px monospace';
    ctx.fillStyle = '#7c3aed';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText((S.cursorMs / 1000).toFixed(3) + 's', x, S.headerH - 8);
}

function drawNowLabel() {
    // Draws the "NOW" label + triangle in the header area (called outside clip)
    const nowMs = S.meta.time_max;
    if (nowMs < S.viewFrom || nowMs > S.viewTo) return;
    const x = msToX(nowMs);
    if (x < S.labelW || x > canvas.width) return;

    // Triangle pointing down at header bottom
    ctx.fillStyle = '#dc2626';
    ctx.beginPath();
    ctx.moveTo(x, S.headerH);
    ctx.lineTo(x - 5, S.headerH - 7);
    ctx.lineTo(x + 5, S.headerH - 7);
    ctx.closePath();
    ctx.fill();

    // Label above triangle
    ctx.font = 'bold 9px monospace';
    ctx.fillStyle = '#dc2626';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('NOW', x, S.headerH - 8);
}

function drawDensity() {
    const d = S.densityCache;
    if (!d) return;

    // Density mode and sub-rows are mutually exclusive in practice: density
    // is triggered only when span > 60s (loadViewport sets cachedEvents=[]),
    // which makes computeSubRowLayout produce S.subRows=[], collapsing
    // nodeLaneH back to S.laneH. nodeToY(nodeName) without ev therefore
    // lands on sub-row 0 = the only row. If a future server returns
    // per-(sf,bw) density buckets, this branch will need explicit handling.
    for (const [nodeName, cats] of Object.entries(d.nodes)) {
        const y = nodeToY(nodeName);
        if (y === null || y + S.laneH < 0 || y > canvas.height) continue;

        for (const [cat, buckets] of Object.entries(cats)) {
            const color = COLORS[cat] || '#999';
            for (let b = 0; b < buckets.length; b++) {
                if (buckets[b] === 0) continue;
                const t0 = d.from_ms + b * d.bucket_ms;
                const t1 = t0 + d.bucket_ms;
                const x0 = msToX(t0);
                const x1 = msToX(t1);

                // Intensity based on count
                const intensity = Math.min(1, buckets[b] / 10);
                ctx.globalAlpha = 0.3 + intensity * 0.7;
                ctx.fillStyle = color;

                const barH = S.laneH - 4;
                let yOff = 2;
                if (cat === 'rx') yOff = S.laneH / 2;
                if (cat === 'collision' || cat === 'drop') yOff = S.laneH - barH / 3 - 2;

                ctx.fillRect(x0, y + yOff, Math.max(1, x1 - x0), cat === 'tx' ? barH / 2 : barH / 3);
            }
        }
    }
    ctx.globalAlpha = 1;
}

function drawEvents() {
    const events = S.cachedEvents;
    const span = S.viewTo - S.viewFrom;
    // Pixel per ms — determines label visibility
    const pxPerMs = (canvas.width - S.labelW) / span;
    const showLabels = pxPerMs > 0.15;  // ~150px per second
    const showSnr = pxPerMs > 0.05;     // ~50px per second

    for (const ev of events) {
        const t = ev.time_ms;
        const at = ev.airtime_ms || 0;
        // Conservative clip: tx events span [t, t+at]; rx-like events span
        // [t-at, t]. Union [t-at, t+at] is safe for both.
        if (t + at < S.viewFrom || t - at > S.viewTo) continue;
        if (!eventTypeAllowed(ev.type)) continue;

        const etype = ev.type;
        const x = msToX(t);

        if (etype === 'tx') {
            const y = nodeToY(ev.node, ev);
            if (y === null || y + S.laneH < 0 || y > canvas.height) continue;
            const airtime = ev.airtime_ms || 50;
            const x2 = msToX(t + airtime);
            const boxW = Math.max(2, x2 - x);
            const boxH = S.laneH / 2 - 2;

            const isTraced = S.tracePkts && S.tracePkts.has(ev.pkt);
            ctx.fillStyle = isTraced ? COLORS.trace_highlight : COLORS.tx;
            ctx.globalAlpha = isTraced ? 0.9 : 0.85;
            ctx.fillRect(x, y + 2, boxW, boxH);
            ctx.globalAlpha = 1;

            // Border
            if (isTraced) {
                ctx.strokeStyle = '#a16207';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(x, y + 2, boxW, boxH);
                ctx.lineWidth = 1;
            }

            // Hop number badge for relay TX bars in trace mode
            if (isTraced && S.traceHopDepth && ev.pkt in S.traceHopDepth) {
                const depth = S.traceHopDepth[ev.pkt];
                if (depth > 0) {
                    const bx = x + boxW - 1;
                    const by = y + 2;
                    const br = 6;
                    ctx.fillStyle = '#ea580c';
                    ctx.beginPath();
                    ctx.arc(bx, by + br, br, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.font = 'bold 8px monospace';
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(String(depth), bx, by + br);
                }
            }

            // Label on TX bar: prefer the script-supplied tag (set via
            // self:tx({label="..."})); fall back to legacy pkt_type, then
            // a truncated pkt hash. Scripts are encouraged to provide
            // a short, meaningful label.
            if (showLabels && boxW > 20) {
                ctx.font = '9px monospace';
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                const maxChars = Math.floor(boxW / 5.5);
                let label;
                if (ev.label && maxChars >= 3) {
                    label = ev.label;
                } else if (ev.pkt_type && maxChars >= 3) {
                    label = ev.pkt_type;
                    if (ev.route && maxChars >= label.length + 2) label += '/' + ev.route;
                } else if (ev.pkt) {
                    label = ev.pkt.slice(0, Math.min(8, maxChars));
                } else {
                    label = '';
                }
                if (label) ctx.fillText(label, x + 2, y + 2 + boxH / 2);
            }
        } else if (etype === 'rx') {
            const y = nodeToY(ev.to, ev);
            if (y === null || y + S.laneH < 0 || y > canvas.height) continue;
            const isTraced = S.tracePkts && S.tracePkts.has(ev.pkt);
            const airtime = ev.airtime_ms || 50;
            // rx event time_ms is the END of reception (delivery to on_recv).
            // Signal propagation is essentially instantaneous, so the receiver
            // was busy from when the sender started TX = time_ms - airtime_ms.
            // Draw the bar to span [TX-start, RX-delivery] on the receiver lane.
            const xStart = msToX(t - airtime);
            const xEnd = msToX(t);
            const boxX = xStart;
            const boxW = Math.max(2, xEnd - xStart);
            const boxH = S.laneH / 2 - 2;
            const boxY = y + S.laneH / 2;

            // Hollow (stroked) bar in lower half of lane
            ctx.strokeStyle = isTraced ? COLORS.trace_highlight : COLORS.rx;
            ctx.lineWidth = isTraced ? 2 : 1.5;
            ctx.globalAlpha = isTraced ? 0.9 : 0.85;
            ctx.strokeRect(boxX, boxY, boxW, boxH);

            // Light fill for visibility
            ctx.fillStyle = isTraced ? COLORS.trace_highlight : COLORS.rx;
            ctx.globalAlpha = isTraced ? 0.2 : 0.15;
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.globalAlpha = 1;
            ctx.lineWidth = 1;

            // SNR label next to RX bar (anchored at end of bar = delivery time).
            if (showSnr && ev.snr !== undefined) {
                ctx.font = '8px monospace';
                ctx.fillStyle = '#16a34a';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(ev.snr.toFixed(1), xEnd + 2, boxY);
            }

            // Inherit the script-supplied label from the matching tx event
            // (joined by pkt) so the receiver lane shows the same semantic
            // tag as the sender.
            if (showLabels && boxW > 20 && ev.pkt && S.txByPkt) {
                const txEv = S.txByPkt[ev.pkt];
                if (txEv && txEv.label) {
                    const maxChars = Math.floor(boxW / 5.5);
                    if (maxChars >= 3) {
                        ctx.font = '9px monospace';
                        ctx.fillStyle = '#15803d';
                        ctx.textAlign = 'left';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(txEv.label, boxX + 2, boxY + boxH / 2);
                    }
                }
            }

            // Draw arrow from sender to receiver if both visible. Anchor at
            // the START of the RX bar (= TX-start time) so the arrow line
            // sits at the moment of signal arrival, not at delivery.
            if (isTraced) {
                const yFrom = nodeToY(ev.from, ev);
                if (yFrom !== null) {
                    ctx.strokeStyle = '#a1620766';
                    ctx.setLineDash([3, 3]);
                    ctx.beginPath();
                    ctx.moveTo(xStart, yFrom + S.laneH / 2);
                    ctx.lineTo(xStart, y + S.laneH / 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
        } else if (etype === 'collision') {
            const y = nodeToY(ev.to, ev);
            if (y === null || y + S.laneH < 0 || y > canvas.height) continue;
            const isTraced = S.tracePkts && S.tracePkts.has(ev.pkt);
            const sz = isTraced ? 8 : 5;
            const cy = y + S.laneH / 2 + 2;

            // Box spanning the whole airtime (= TX-start to time_ms).
            // The receiver was demodulating during this whole period
            // before the collision verdict was known at end-of-airtime.
            const airtime = ev.airtime_ms || 0;
            if (airtime > 0) {
                const xStart = msToX(t - airtime);
                const xEnd = x;
                const boxX = xStart;
                const boxW = Math.max(2, xEnd - xStart);
                const boxH = S.laneH / 2 - 2;
                const boxY = y + S.laneH / 2;

                ctx.fillStyle = isTraced ? '#dc2626' : COLORS.collision;
                ctx.globalAlpha = isTraced ? 0.4 : 0.25;
                ctx.fillRect(boxX, boxY, boxW, boxH);

                // Diagonal hatch — same pattern as drop_halfduplex but
                // in collision orange so the user can tell them apart.
                ctx.save();
                ctx.beginPath();
                ctx.rect(boxX, boxY, boxW, boxH);
                ctx.clip();
                ctx.strokeStyle = isTraced ? '#dc2626' : COLORS.collision;
                ctx.lineWidth = 1;
                ctx.globalAlpha = isTraced ? 0.7 : 0.5;
                const step = 6;
                for (let lx = boxX - boxH; lx < boxX + boxW + boxH; lx += step) {
                    ctx.beginPath();
                    ctx.moveTo(lx, boxY + boxH);
                    ctx.lineTo(lx + boxH, boxY);
                    ctx.stroke();
                }
                ctx.restore();
                ctx.globalAlpha = 1;
                ctx.lineWidth = 1;
            }

            if (isTraced) {
                // Bright glow circle behind the X (still useful punctuation)
                ctx.fillStyle = '#dc262644';
                ctx.beginPath();
                ctx.arc(x, cy, sz + 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#dc262622';
                ctx.beginPath();
                ctx.arc(x, cy, sz + 8, 0, Math.PI * 2);
                ctx.fill();
            }

            // X mark at TX-end (= the moment the collision verdict
            // landed). Reads as "this is where the failure was decided."
            ctx.strokeStyle = isTraced ? '#dc2626' : COLORS.collision;
            ctx.lineWidth = isTraced ? 3 : 1.5;
            ctx.globalAlpha = isTraced ? 1 : 0.85;
            ctx.beginPath();
            ctx.moveTo(x - sz, cy - sz); ctx.lineTo(x + sz, cy + sz);
            ctx.moveTo(x + sz, cy - sz); ctx.lineTo(x - sz, cy + sz);
            ctx.stroke();
            ctx.lineWidth = 1;
            ctx.globalAlpha = 1;

            // SNR label for collision
            if (showSnr && ev.snr !== undefined) {
                ctx.font = isTraced ? '10px monospace' : '8px monospace';
                ctx.fillStyle = isTraced ? '#dc2626' : '#dc2626';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(ev.snr.toFixed(1), x + sz + 2, cy - sz);
            }

            // Interferer label below the X when zoomed in
            if (showLabels && ev.interferer) {
                ctx.font = '8px monospace';
                ctx.fillStyle = '#dc2626';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('by ' + ev.interferer, x, cy + sz + 2);
            }
        } else if (etype === 'drop_halfduplex') {
            const y = nodeToY(ev.to, ev);
            if (y === null || y + S.laneH < 0 || y > canvas.height) continue;
            const isTraced = S.tracePkts && S.tracePkts.has(ev.pkt);
            const airtime = ev.airtime_ms || 50;
            // Same timing semantics as rx: time_ms is end-of-reception.
            const xStart = msToX(t - airtime);
            const xEnd = msToX(t);
            const boxX = xStart;
            const boxW = Math.max(2, xEnd - xStart);
            const boxH = S.laneH / 2 - 2;
            const boxY = y + S.laneH / 2;

            // Solid red fill — clearly "failed"
            ctx.fillStyle = isTraced ? '#dc2626' : '#b91c1c';
            ctx.globalAlpha = isTraced ? 0.5 : 0.4;
            ctx.fillRect(boxX, boxY, boxW, boxH);

            // Diagonal hatch lines across the bar
            ctx.save();
            ctx.beginPath();
            ctx.rect(boxX, boxY, boxW, boxH);
            ctx.clip();
            ctx.strokeStyle = isTraced ? '#dc2626' : '#b91c1c';
            ctx.lineWidth = 1;
            ctx.globalAlpha = isTraced ? 0.8 : 0.6;
            const step = 6;
            for (let lx = boxX - boxH; lx < boxX + boxW + boxH; lx += step) {
                ctx.beginPath();
                ctx.moveTo(lx, boxY + boxH);
                ctx.lineTo(lx + boxH, boxY);
                ctx.stroke();
            }
            ctx.restore();
            ctx.globalAlpha = 1;
            ctx.lineWidth = 1;
        } else if (etype === 'drop_weak' || etype === 'drop_sf_mismatch') {
            const y = nodeToY(ev.to || ev.node, ev);
            if (y === null || y + S.laneH < 0 || y > canvas.height) continue;
            const isTraced = S.tracePkts && S.tracePkts.has(ev.pkt);
            // Anchor at TX-start (= time_ms - airtime_ms) — the moment
            // the receiver first saw the in-air signal.
            const airtime = ev.airtime_ms || 0;
            const xMark = msToX(t - airtime);
            const isMismatch = (etype === 'drop_sf_mismatch');

            if (isMismatch && airtime > 0) {
                // drop_sf_mismatch is now SNR-gated (only emitted on
                // receivers that WOULD have decoded at the correct SF).
                // Render as an airtime-spanning box so the user sees
                // "this whole period was wasted on a wrong-SF packet"
                // — same pattern as drop_halfduplex but in pink.
                const xEnd = msToX(t);
                const boxX = xMark;
                const boxW = Math.max(2, xEnd - xMark);
                const boxH = S.laneH / 2 - 2;
                const boxY = y + S.laneH / 2;

                ctx.fillStyle = COLORS.drop_sf_mismatch;
                ctx.globalAlpha = isTraced ? 0.45 : 0.3;
                ctx.fillRect(boxX, boxY, boxW, boxH);

                ctx.save();
                ctx.beginPath();
                ctx.rect(boxX, boxY, boxW, boxH);
                ctx.clip();
                ctx.strokeStyle = COLORS.drop_sf_mismatch;
                ctx.lineWidth = 1;
                ctx.globalAlpha = isTraced ? 0.75 : 0.55;
                const step = 6;
                for (let lx = boxX - boxH; lx < boxX + boxW + boxH; lx += step) {
                    ctx.beginPath();
                    ctx.moveTo(lx, boxY + boxH);
                    ctx.lineTo(lx + boxH, boxY);
                    ctx.stroke();
                }
                ctx.restore();
                ctx.globalAlpha = 1;
                ctx.lineWidth = 1;

                // SNR badge above the box (only when zoomed in enough).
                if (typeof ev.snr_db === 'number'
                    && (S.viewTo - S.viewFrom) < 30000 && boxW >= 18) {
                    ctx.font = '8px monospace';
                    ctx.fillStyle = COLORS.drop_sf_mismatch;
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(ev.snr_db.toFixed(1), boxX + 2, boxY - 5);
                }
            } else if (isTraced) {
                // Traced drop_weak — small but visible marker.
                ctx.fillStyle = (COLORS[etype] || '#ff8888') + '44';
                ctx.beginPath();
                ctx.arc(xMark, y + S.laneH - 4, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = COLORS[etype] || '#ff8888';
                ctx.fillRect(xMark - 3, y + S.laneH - 7, 6, 6);
            } else {
                // drop_weak — keep the small unobtrusive marker; emitted
                // for every below-threshold reachable receiver and would
                // flood the view if expanded to a box.
                ctx.fillStyle = COLORS[etype] || '#ff8888';
                ctx.globalAlpha = 0.6;
                ctx.fillRect(xMark - 1, y + S.laneH - 5, 3, 3);
                ctx.globalAlpha = 1;
            }
        } else if (etype === 'cmd_reply' || etype === 'script_log' || etype === 'script_emit') {
            const y = nodeToY(ev.node, ev);
            if (y === null || y + S.laneH < 0 || y > canvas.height) continue;
            const isFlightTraced = S.traceFlightEventSet
                && S.traceFlightEventSet.has(ev);
            ctx.fillStyle = isFlightTraced
                ? COLORS.trace_highlight
                : (COLORS[etype] || '#cccccc');
            ctx.globalAlpha = isFlightTraced ? 1.0 : 0.8;
            // Diamond — bigger when on the traced flight so it stands out
            const sz = isFlightTraced ? 5 : 3;
            const cy = y + S.laneH / 2;
            ctx.beginPath();
            ctx.moveTo(x, cy - sz);
            ctx.lineTo(x + sz, cy);
            ctx.lineTo(x, cy + sz);
            ctx.lineTo(x - sz, cy);
            ctx.closePath();
            ctx.fill();
            if (isFlightTraced) {
                ctx.strokeStyle = '#a16207';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.lineWidth = 1;
            }
            ctx.globalAlpha = 1;
        } else if (etype === 'tx_deferred') {
            const y = nodeToY(ev.node, ev);
            if (y === null || y + S.laneH < 0 || y > canvas.height) continue;
            // Yellow triangle pointing up
            const sz = 4;
            const cy = y + S.laneH / 4;
            ctx.fillStyle = COLORS.tx_deferred;
            ctx.globalAlpha = 0.85;
            ctx.beginPath();
            ctx.moveTo(x, cy - sz);
            ctx.lineTo(x + sz, cy + sz);
            ctx.lineTo(x - sz, cy + sz);
            ctx.closePath();
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }
}

// Connect every event of the currently-traced flight with a single polyline
// in chronological order. The path zigzags between node lanes — RTS at the
// originator, CTS-rx back at the originator, DATA-tx, then chains onward to
// the next forwarder, etc. — giving a single visual narrative of the
// flight's journey across the mesh. Skipped if a flight isn't being traced
// or fewer than 2 events exist.
function drawFlightPolyline() {
    if (!S.traceFlight) return;
    if (!S.traceEvents || S.traceEvents.length < 2) return;

    const sorted = [...S.traceEvents].sort((a, b) => a.time_ms - b.time_ms);
    const pts = [];
    for (const ev of sorted) {
        const x = msToX(ev.time_ms);
        const y = nodeToY(ev.node, ev);
        if (y === null) continue;
        pts.push({ x: x, y: y + S.laneH / 2 });
    }
    if (pts.length < 2) return;

    // Polyline (orange, semi-transparent) sitting above the bars but below
    // the per-packet rays so both layers stay legible.
    ctx.save();
    ctx.strokeStyle = '#ea580c';
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) {
        ctx.lineTo(pts[i].x, pts[i].y);
    }
    ctx.stroke();

    // Small filled circles at each waypoint so the path's nodes are easy
    // to count even when zoomed out.
    ctx.fillStyle = '#ea580c';
    ctx.globalAlpha = 0.85;
    for (const p of pts) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

function drawTrace() {
    if (!S.traceEvents.length) return;
    if (!S.raysMode) return;

    // Sort by time
    const sorted = [...S.traceEvents].sort((a, b) => a.time_ms - b.time_ms);

    // Index TX events by (pkt, node) for matching to RX
    const txByPktNode = {};
    for (const ev of sorted) {
        if (ev.type === 'tx') {
            const key = (ev.pkt || '') + ':' + ev.node;
            txByPktNode[key] = ev;
        }
    }

    // Draw rays: TX end → RX marker for each (pkt, from) match
    for (const rx of sorted) {
        if (rx.type !== 'rx') continue;
        const key = (rx.pkt || '') + ':' + rx.from;
        const tx = txByPktNode[key];
        if (!tx) continue;

        const x1 = msToX(tx.time_ms + (tx.airtime_ms || 50));
        const y1 = nodeToY(tx.node, tx);
        const x2 = msToX(rx.time_ms);
        const y2 = nodeToY(rx.to, rx);

        if (y1 === null || y2 === null) continue;

        const cy1 = y1 + S.laneH / 4;
        const cy2 = y2 + S.laneH / 2;

        // Ray line
        ctx.strokeStyle = '#a16207aa';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x1, cy1);
        ctx.lineTo(x2, cy2);
        ctx.stroke();

        // Arrowhead
        const dx = x2 - x1, dy = cy2 - cy1;
        const len = Math.sqrt(dx * dx + dy * dy);
        if (len > 8) {
            const ax = dx / len, ay = dy / len;
            const sz = 5;
            ctx.fillStyle = '#a16207aa';
            ctx.beginPath();
            ctx.moveTo(x2, cy2);
            ctx.lineTo(x2 - sz * ax + sz * 0.4 * ay, cy2 - sz * ay - sz * 0.4 * ax);
            ctx.lineTo(x2 - sz * ax - sz * 0.4 * ay, cy2 - sz * ay + sz * 0.4 * ax);
            ctx.closePath();
            ctx.fill();
        }
    }

    // Draw relay links: RX → relay TX within the same lane (pkt hash changes on relay)
    // Orange solid arrows to clearly show the path-building relay chain
    for (const hop of (S.deepTrace ? S.deepTrace.hops : [])) {
        if (!hop.relay_from) continue;
        const parentHop = (S.deepTrace.hops || []).find(h => h.pkt === hop.relay_from);
        if (!parentHop) continue;
        const relayTx = hop.events.find(e => e.type === 'tx');
        if (!relayTx) continue;
        const triggerRx = parentHop.events.find(e => e.type === 'rx' && e.to === relayTx.node);
        if (!triggerRx) continue;

        const rxAirtime = triggerRx.airtime_ms || 50;
        const x1 = msToX(triggerRx.time_ms + rxAirtime);
        const y = nodeToY(relayTx.node, relayTx);
        const x2 = msToX(relayTx.time_ms);
        if (y === null) continue;

        // Orange arrow within lane: RX end → relay TX start
        const cy1 = y + S.laneH * 3 / 4;  // bottom half (RX area)
        const cy2 = y + S.laneH / 4;       // top half (TX area)
        ctx.strokeStyle = '#ea580ccc';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x1, cy1);
        // Curved connector: slight arc to make it visually distinct
        const cpx = (x1 + x2) / 2;
        const cpy = y + S.laneH / 2;
        ctx.quadraticCurveTo(cpx, cpy, x2, cy2);
        ctx.stroke();

        // Arrowhead at relay TX
        const adx = x2 - cpx, ady = cy2 - cpy;
        const alen = Math.sqrt(adx * adx + ady * ady);
        if (alen > 4) {
            const ax = adx / alen, ay = ady / alen;
            const sz = 4;
            ctx.fillStyle = '#ea580ccc';
            ctx.beginPath();
            ctx.moveTo(x2, cy2);
            ctx.lineTo(x2 - sz * ax + sz * 0.5 * ay, cy2 - sz * ay - sz * 0.5 * ax);
            ctx.lineTo(x2 - sz * ax - sz * 0.5 * ay, cy2 - sz * ay + sz * 0.5 * ax);
            ctx.closePath();
            ctx.fill();
        }
    }

    // Draw response connectors (companion response TXs) in green
    for (const hop of (S.deepTrace ? S.deepTrace.hops : [])) {
        if (!hop.response_from) continue;
        const parentHop = (S.deepTrace.hops || []).find(h => h.pkt === hop.response_from);
        if (!parentHop) continue;
        const respTx = hop.events.find(e => e.type === 'tx');
        if (!respTx) continue;
        const triggerRx = parentHop.events.find(e => e.type === 'rx' && e.to === respTx.node);
        if (!triggerRx) continue;

        const x1 = msToX(triggerRx.time_ms);
        const y = nodeToY(respTx.node, respTx);
        const x2 = msToX(respTx.time_ms);
        if (y === null) continue;

        const cy = y + S.laneH / 2;
        ctx.strokeStyle = '#16a34a66';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(x1, cy);
        ctx.lineTo(x2, cy - S.laneH / 4);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    ctx.lineWidth = 1;
}

// ── Time formatting ────────────────────────────────────────────
function formatTime(ms) {
    const s = ms / 1000;
    if (s < 60) return s.toFixed(s < 10 ? 2 : 1) + 's';
    const m = Math.floor(s / 60);
    const rem = s - m * 60;
    return m + ':' + rem.toFixed(1).padStart(4, '0');
}

function formatDuration(ms) {
    if (ms < 1000) return ms + 'ms';
    if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
    return (ms / 60000).toFixed(1) + 'min';
}

// ── Interaction ────────────────────────────────────────────────
canvas.addEventListener('wheel', async (e) => {
    e.preventDefault();
    if (followMode) { followMode = false; updateFollowIndicator(); }
    const span = S.viewTo - S.viewFrom;

    if (e.ctrlKey || e.metaKey) {
        // Ctrl+wheel: zoom in/out (centered on mouse)
        const mouseMs = xToMs(e.offsetX);
        const factor = e.deltaY > 0 ? 1.3 : 1 / 1.3;
        const newSpan = Math.max(100, Math.min(S.meta.time_max - S.meta.time_min, span * factor));
        const ratio = (mouseMs - S.viewFrom) / span;
        S.viewFrom = mouseMs - ratio * newSpan;
        S.viewTo = mouseMs + (1 - ratio) * newSpan;
        clampViewport();
        await loadViewport();
    } else if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
        // Shift+wheel or horizontal scroll: move time window left/right
        const delta = (e.shiftKey ? e.deltaY : e.deltaX);
        const dMs = delta / (canvas.width - S.labelW) * span * 2;
        S.viewFrom += dMs;
        S.viewTo += dMs;
        clampViewport();
        await loadViewport();
    } else {
        // Vertical scroll: scroll node lanes up/down
        S.scrollY += e.deltaY;
        updateMaxScrollY();
        S.scrollY = Math.max(0, Math.min(S.scrollY, S.maxScrollY));
    }

    render();
}, { passive: false });

canvas.addEventListener('mousedown', (e) => {
    if (e.offsetX < S.labelW) return;
    S.dragging = true;
    S.dragMoved = false;
    S.dragStartX = e.offsetX;
    S.dragStartY = e.offsetY;
    S.dragViewFrom = S.viewFrom;
    S.dragScrollY = S.scrollY;
});

// Throttle mousemove handling to rAF (~60 Hz). Without this, dense
// browsers fire mousemove >100×/sec and each tick triggers a render
// of 20k+ events plus a hit-test scan — felt laggy on big sims.
let _mmRafPending = false;
let _mmLatest = null;
async function _handleMouseMove(e) {
    if (S.dragging) {
        const dx = e.offsetX - S.dragStartX;
        const dy = e.offsetY - S.dragStartY;
        if (!S.dragMoved && Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
        S.dragMoved = true;
        canvas.style.cursor = 'grabbing';
        if (followMode) { followMode = false; updateFollowIndicator(); }
        const span = S.viewTo - S.viewFrom;

        // Horizontal: pan time
        const dMs = -dx / (canvas.width - S.labelW) * span;
        S.viewFrom = S.dragViewFrom + dMs;
        S.viewTo = S.viewFrom + span;
        clampViewport();

        // Vertical: scroll nodes
        S.scrollY = S.dragScrollY - dy;
        updateMaxScrollY();
        S.scrollY = Math.max(0, Math.min(S.scrollY, S.maxScrollY));

        // Render first from current cache so the drag stays responsive,
        // THEN await any cache refill in the background. The next rAF
        // re-render picks up new events; if the user keeps dragging we
        // coalesce naturally.
        render();
        loadViewport().then(() => { render(); }).catch(() => {});
        return;
    }
    updateHover(e.offsetX, e.offsetY);
}
canvas.addEventListener('mousemove', (e) => {
    _mmLatest = { offsetX: e.offsetX, offsetY: e.offsetY };
    if (_mmRafPending) return;
    _mmRafPending = true;
    requestAnimationFrame(() => {
        _mmRafPending = false;
        const ev = _mmLatest;
        if (ev) _handleMouseMove(ev);
    });
});

canvas.addEventListener('mouseup', () => {
    S.dragging = false;
    canvas.style.cursor = 'default';
});

canvas.addEventListener('mouseleave', () => {
    S.dragging = false;
    canvas.style.cursor = 'default';
    tooltip.style.display = 'none';
});

canvas.addEventListener('dblclick', () => {
    if (INTERACTIVE_ID && !followMode) {
        followMode = true;
        updateFollowIndicator();
    }
});

canvas.addEventListener('click', async (e) => {
    // Skip event selection if this was a drag gesture
    if (S.dragMoved) return;

    if (e.offsetX < S.labelW) {
        // Clicked on node label — use rendered scrollY
        const _subRowCount = Math.max(1, S.subRows.length);
        const _nodeLaneH = S.laneH * _subRowCount;
        const laneIdx = Math.floor((e.offsetY - S.headerH + S.renderedScrollY) / _nodeLaneH);
        if (laneIdx >= 0 && laneIdx < S.nodes.length) {
            const n = S.nodes[laneIdx].name;
            showNodeDetail(n);
            emitFocusNode(n);                      // cross-iframe: center map on node
        }
        return;
    }

    const hits = findEventsAt(e.offsetX, e.offsetY);
    if (hits.length > 1) {
        showEventChooser(hits);
        const focusNode = hits[0].node || hits[0].from || hits[0].to;
        if (focusNode) emitFocusNode(focusNode);
        return;
    }
    const hit = hits.length ? hits[0] : null;
    if (hit) {
        if (hit.type === 'script_emit') {
            showEventDetail(hit);
            const focusNode = hit.node || hit.from || hit.to;
            if (focusNode) emitFocusNode(focusNode);
            return;
        }

        // Prefer flight trace when the event carries a (origin, payload)
        // tuple — that's the script-emit-side flight identifier we added
        // for end-to-end visualisation. Falls through to pkt trace for
        // wire-level events without origin/payload.
        const d = hit.data || {};
        if (hit.type === 'script_emit'
            && d.origin !== undefined && d.payload !== undefined) {
            if (!S.traceMode) {
                S.traceMode = true;
                document.getElementById('btn-trace-mode').classList.add('active');
            }
            await traceFlight(d.origin, d.payload);
        } else if (hit.pkt) {
            if (!S.traceMode) {
                S.traceMode = true;
                document.getElementById('btn-trace-mode').classList.add('active');
            }
            await tracePkt(hit.pkt);
        } else {
            showEventDetail(hit);
        }
        // Center the sibling map view on the TX source (or fall back to
        // the receiver for pure RX/collision/drop events).
        const focusNode = hit.node || hit.from || hit.to;
        if (focusNode) emitFocusNode(focusNode);
    }
});

// Post a focus-node hint to the parent window so sibling iframes (e.g. the
// live map) can sync their view. No-op when loaded standalone.
function emitFocusNode(name) {
    if (!name || window.parent === window) return;
    try {
        window.parent.postMessage({ type: 'mlv-focus-node', node: name }, '*');
    } catch (_) { /* ignore */ }
}

// ── Cross-iframe time sync ──────────────────────────────────────────
// The live map's scrubber posts {type: 'mlv-scrub-time', t: ms} when the
// user drags it. Center our viewport on that moment so both views share
// context. No-op when loaded standalone or before meta has loaded.
async function centerViewportOnTime(t) {
    if (!S.meta) return;
    const span = S.viewTo - S.viewFrom;
    S.viewFrom = t - span * 0.5;
    S.viewTo = S.viewFrom + span;
    clampViewport();
    await loadViewport();
    render();
}

window.addEventListener('message', (e) => {
    if (!e.data || typeof e.data !== 'object') return;
    if (e.data.type === 'mlv-scrub-time' && typeof e.data.t === 'number') {
        // Recenter viewport AND update playback cursor (jump-style scrub).
        S.cursorMs = e.data.t;
        centerViewportOnTime(e.data.t);
    } else if (e.data.type === 'mlv-cursor-time' && typeof e.data.t === 'number') {
        // Cursor-only update (does NOT recenter — used during normal
        // playback so the user's manual scrolling isn't fought).
        S.cursorMs = e.data.t;
        render();
    }
});

function findEventsAt(mx, my) {
    if (S.densityCache) return [];
    if (my < S.headerH) return [];

    // Use rendered viewport state so hit-testing matches what's actually drawn
    const vFrom = S.renderedViewFrom;
    const vTo = S.renderedViewTo;
    const sY = S.renderedScrollY;
    const ms = vFrom + (mx - S.labelW) / (canvas.width - S.labelW) * (vTo - vFrom);
    const subRowCount = Math.max(1, S.subRows.length);
    const nodeLaneH = S.laneH * subRowCount;
    const laneIdx = Math.floor((my - S.headerH + sY) / nodeLaneH);
    if (laneIdx < 0 || laneIdx >= S.nodes.length) return [];
    const targetNode = S.nodes[laneIdx].name;

    // Determine sub-row and whether click is in upper half (TX) or lower half (RX)
    const localY = (my - S.headerH + sY) - laneIdx * nodeLaneH;
    const subRowIdx = Math.floor(localY / S.laneH);
    const inUpperHalf = (localY - subRowIdx * S.laneH) < S.laneH / 2;

    // Search nearby events — TX bars match over their full airtime width
    const hits = [];
    const span = vTo - vFrom;
    const tolerance = span * 0.008; // 0.8% of viewport for point events

    for (const ev of S.cachedEvents) {
        if (!eventTypeAllowed(ev.type)) continue;  // honor type filter in hit-test too
        let evNode = ev.node || ev.to || ev.from;
        if (ev.type === 'rx' || ev.type === 'collision' || ev.type.startsWith('drop')) {
            evNode = ev.to;
        }
        // Coerce integer node id → name (script_emit uses int).
        evNode = nodeIdToName(evNode);
        if (evNode !== targetNode) continue;
        // Filter by sub-row: only match events in the clicked sub-row
        if (subRowFor(ev) !== subRowIdx) continue;

        // Check lane half: TX in upper, RX/collision/drop in lower
        const isTxType = ev.type === 'tx' || ev.type === 'cmd_reply';
        const isRxType = !isTxType;
        // Prefer events in the correct half, but allow cross-half if nothing else matches
        const halfMismatch = (inUpperHalf && isRxType) || (!inUpperHalf && isTxType);

        let dist;
        if (ev.type === 'tx' || ev.type === 'rx' || ev.type === 'drop_halfduplex') {
            // TX/RX bar spans [time_ms, time_ms + airtime_ms]
            const end = ev.time_ms + (ev.airtime_ms || 50);
            if (ms >= ev.time_ms - tolerance && ms <= end + tolerance) {
                // Distance = 0 if inside bar, otherwise distance to nearest edge
                dist = (ms >= ev.time_ms && ms <= end) ? 0 : Math.min(Math.abs(ms - ev.time_ms), Math.abs(ms - end));
            } else {
                continue;
            }
        } else {
            dist = Math.abs(ev.time_ms - ms);
            if (dist > tolerance) continue;
        }

        // Penalize events in wrong lane half so correct-half events win
        if (halfMismatch) dist += tolerance * 2;

        hits.push({ ev, dist });
    }
    hits.sort((a, b) => a.dist - b.dist || (a.ev.time_ms || 0) - (b.ev.time_ms || 0));
    return hits.map(h => h.ev);
}

function findEventAt(mx, my) {
    const hits = findEventsAt(mx, my);
    return hits.length ? hits[0] : null;
}

function updateHover(mx, my) {
    const hit = findEventAt(mx, my);
    if (!hit) {
        tooltip.style.display = 'none';
        return;
    }

    // Find event index for reference
    const evIdx = S.cachedEvents.indexOf(hit);
    const idxStr = evIdx >= 0 ? ` #${S.cachedFrom > 0 ? '~' : ''}${evIdx}` : '';

    // Human-readable explanation per event type \u2014 answers
    // "what am I looking at?" without forcing the user to memorize
    // event names.
    const TYPE_EXPLANATION = {
        tx:                'TX \u2014 node transmitted a packet',
        rx:                'RX \u2014 successfully received',
        collision:         'RX collided \u2014 interferer destroyed the packet mid-demod',
        drop_sf_mismatch:  'RX ignored \u2014 receiver tuned to a different SF',
