        drop_halfduplex:   'RX missed \u2014 node was transmitting at the same time',
        drop_weak:         'RX too weak \u2014 signal below the demod floor at this SF',
        drop_loss:         'RX dropped \u2014 stochastic link loss',
        tx_deferred:       'TX deferred \u2014 channel busy or self-TX in flight',
        script_log:        'script log',
        script_emit:       'script emit',
        cmd_reply:         'command reply',
        node_ready:        'node ready',
    };
    let text = `${hit.type}${idxStr} @ ${formatTime(hit.time_ms)}`;
    if (TYPE_EXPLANATION[hit.type]) {
        text += `\n${TYPE_EXPLANATION[hit.type]}`;
    }
    if (hit.node) text += `\nnode: ${hit.node}`;
    if (hit.from) text += `\nfrom: ${hit.from}`;
    if (hit.to) text += `\nto: ${hit.to}`;
    if (hit.pkt) text += `\npkt: ${hit.pkt}`;
    if (hit.hex) text += `\nhex: ${hit.hex.slice(0, 32)}${hit.hex.length > 32 ? '\u2026' : ''}`;
    // SNR/RSSI come under different field names on different events
    // (snr/rssi on rx + collision; snr_db/rssi_dbm on drop_sf_mismatch).
    const snr  = (hit.snr  !== undefined) ? hit.snr  : hit.snr_db;
    const rssi = (hit.rssi !== undefined) ? hit.rssi : hit.rssi_dbm;
    if (snr  !== undefined && snr  !== null) text += `\nsnr: ${snr.toFixed(1)} dB`;
    if (rssi !== undefined && rssi !== null) text += `\nrssi: ${rssi.toFixed(1)} dBm`;
    if (hit.interferer) text += `\ninterferer: ${hit.interferer}`;
    if (hit.interferer_snr !== undefined && hit.interferer) text += `\ninterferer_snr: ${hit.interferer_snr.toFixed(1)} dB`;
    if (hit.snr_margin !== undefined && hit.interferer) text += `\nmargin: ${hit.snr_margin.toFixed(1)} dB (needed to survive)`;
    if (hit.airtime_ms) text += `\nairtime: ${hit.airtime_ms}ms`;
    if (hit.command) text += `\ncmd: ${hit.command}`;
    if (hit.reply) text += `\nreply: ${hit.reply.slice(0, 80)}`;
    if (hit.threshold) text += `\nthreshold: ${hit.threshold.toFixed(1)} dB`;
    if (hit.loss !== undefined) text += `\nloss prob: ${hit.loss.toFixed(2)}`;
    if (typeof hit.sf === 'number' && typeof hit.bw_hz === 'number') {
        text += `\nSF${hit.sf} / ${Math.round(hit.bw_hz / 1000)} kHz`;
    }
    // drop_sf_mismatch: also surface the mismatch (packet vs receiver SF).
    if (hit.type === 'drop_sf_mismatch'
        && typeof hit.packet_sf === 'number'
        && typeof hit.rx_sf === 'number') {
        const rxLabel = (hit.rx_sf === -1) ? 'multi-SF scanner' : `SF${hit.rx_sf}`;
        text += `\npacket SF${hit.packet_sf} \u2192 receiver ${rxLabel}`;
    }

    tooltip.textContent = text;
    tooltip.style.display = 'block';
    tooltip.style.left = Math.min(mx + 12, canvas.width - 300) + 'px';
    tooltip.style.top = (my + 12) + 'px';
}

// ── lus event vocabulary — no per-protocol packet decoder ─────────────────────────────────────

// ── Trace mode ─────────────────────────────────────────────────
// lus has no deep_trace endpoint; highlight all cached events sharing this pkt hash
async function tracePkt(pkt) {
    S.tracePkt = pkt;
    if (window.parent !== window) {
        try { window.parent.postMessage({ type: 'mlv-trace-pkt', pkt }, '*'); }
        catch (_) { /* ignore */ }
    }

    // Collect matching events from the current event cache
    const matched = S.cachedEvents.filter(ev => ev.pkt === pkt);
    S.traceEvents = matched;
    S.tracePkts = new Set([pkt]);
    S.deepTrace = null;
    S.traceHopDepth = null;

    // Auto-switch to trace sort order
    const orderSelect = document.getElementById('node-order');
    if (orderSelect.value !== 'trace') {
        S.preTraceOrder = orderSelect.value;
        orderSelect.value = 'trace';
    }
    sortNodes();

    showTraceDetail(pkt, matched);
    render();
}

// Trace every event tied to the same end-to-end flight (one origin, one
// payload). Walks the cached events looking for script_emits whose data
// carries (origin, payload), then collects the wire-level pkts those
// emissions produced (via timestamp + node + label match against tx
// events) so the existing isTraced/ray rendering picks them up too.
async function traceFlight(origin, payload) {
    S.traceFlight = { origin: origin, payload: payload };
    S.tracePkt = null;
    if (window.parent !== window) {
        try { window.parent.postMessage({
            type: 'mlv-trace-flight', origin: origin, payload: payload,
        }, '*'); } catch (_) { /* ignore */ }
    }

    // 1) Match script_emits whose data has this exact (origin, payload).
    //    Pre-DATA receiver events (rts_rx, cts_tx, nack_tx, ...) carry
    //    only origin (no payload yet); they're not strictly "in this
    //    flight" — they could belong to any of this origin's flights —
    //    so we leave them out of the strict match. Future work: walk
    //    msg_id chains at each node to fold them in.
    const flightEmits = [];
    for (const ev of S.cachedEvents) {
        if (ev.type !== 'script_emit') continue;
        const d = ev.data || {};
        if (d.origin !== origin) continue;
        if (d.payload !== payload) continue;
        flightEmits.push(ev);
    }

    // 2) For each flight script_emit that's a "tx-side" event, find the
    //    nearest tx event at the same node + same time and harvest its
    //    pkt hash. That's how the existing isTraced/ray rendering finds
    //    these on-air frames.
    const TX_SIDE_LABELS = {
        rts_tx: ['RTS', 'RTS-fwd'],
        rts_retry: ['RTS-rty'],
        cts_tx: ['CTS', 'CTS-dup'],
        data_tx: ['DATA'],
        ack_tx: ['ACK', 'K-dup'],
        nack_tx: ['NACK'],
    };
    const pkts = new Set();
    for (const emit of flightEmits) {
        const labels = TX_SIDE_LABELS[emit.emit_type];
        if (!labels) continue;
        const emitNodeName = nodeIdToName(emit.node);
        // Same-node tx event within ±1 ms of the script_emit, label-matched
        for (const ev of S.cachedEvents) {
            if (ev.type !== 'tx') continue;
            if (ev.node !== emitNodeName) continue;
            if (Math.abs(ev.time_ms - emit.time_ms) > 1) continue;
            if (!labels.includes(ev.label)) continue;
            if (ev.pkt) pkts.add(ev.pkt);
            break;
        }
    }

    // Reuse the pkt-trace machinery for highlighting wire-level events.
    S.tracePkts = pkts;
    S.traceFlightEventSet = new Set(flightEmits);
    S.traceEvents = flightEmits;
    S.deepTrace = null;
    S.traceHopDepth = null;

    // Auto-switch to trace sort order
    const orderSelect = document.getElementById('node-order');
    if (orderSelect && orderSelect.value !== 'trace') {
        S.preTraceOrder = orderSelect.value;
        orderSelect.value = 'trace';
    }
    sortNodes();

    showFlightDetail(origin, payload, flightEmits, pkts);
    render();
}

function showFlightDetail(origin, payload, emits, pkts) {
    openSidebar();
    const originName = nodeIdToName(origin) || ('#' + origin);
    let html = `<div class="event-detail">`;
    html += `<h3>Flight</h3>`;
    html += `<div class="field"><span class="key">origin: </span>${escHtml(originName)} (id ${origin})</div>`;
    html += `<div class="field"><span class="key">payload: </span>${escHtml(payload)}</div>`;
    html += `<div class="field"><span class="key">events: </span>${emits.length} script_emit, ${pkts.size} on-air pkt(s)</div>`;
    html += `<button onclick="clearTrace()" style="margin-top:8px;">Clear flight trace</button>`;
    html += `</div>`;
    sidebarContent.innerHTML = html;
}

function clearTrace() {
    S.tracePkt = null;
    S.traceEvents = [];
    S.tracePkts = null;
    S.deepTrace = null;
    S.traceHopDepth = null;
    S.traceFlight = null;
    S.traceFlightEventSet = null;

    // Restore previous sort order if we auto-switched to trace
    const orderSelect = document.getElementById('node-order');
    if (orderSelect.value === 'trace' && S.preTraceOrder) {
        orderSelect.value = S.preTraceOrder;
    }
    S.preTraceOrder = null;
    sortNodes();

    render();
}

// ── Navigation helpers ─────────────────────────────────────────
async function jumpToEvent(nodeName, timeMs) {
    // Ensure node is visible vertically
    const idx = S.nodeIndex[nodeName];
    if (idx !== undefined) {
        const _subRowCount = Math.max(1, S.subRows.length);
        const _nodeLaneH = S.laneH * _subRowCount;
        const targetY = idx * _nodeLaneH;
        const visibleH = canvas.height - S.headerH;
        if (targetY < S.scrollY || targetY + _nodeLaneH > S.scrollY + visibleH) {
            S.scrollY = Math.max(0, targetY - visibleH / 2);
            updateMaxScrollY();
            S.scrollY = Math.min(S.scrollY, S.maxScrollY);
        }
    }

    // Center time window on event
    const span = S.viewTo - S.viewFrom;
    S.viewFrom = timeMs - span * 0.3;
    S.viewTo = S.viewFrom + span;
    clampViewport();

    await loadViewport();
    render();
}

// ── Sidebar detail views ───────────────────────────────────────
const SIDEBAR_MIN_W = 200;
const SIDEBAR_DEFAULT_W = 480;

function _restoreSidebarWidth() {
    try {
        const saved = parseFloat(localStorage.getItem('viz-sidebar-width'));
        if (saved && saved >= SIDEBAR_MIN_W) return saved;
    } catch (_) {}
    return SIDEBAR_DEFAULT_W;
}

function openSidebar() {
    sidebar.style.width = _restoreSidebarWidth() + 'px';
    sidebar.classList.add('open');
    const resizer = document.getElementById('sidebar-resizer');
    if (resizer) resizer.classList.add('shown');
    setTimeout(() => { resize(); render(); }, 220);
}

function closeSidebar() {
    sidebar.classList.remove('open');
    sidebar.style.width = '';
    const resizer = document.getElementById('sidebar-resizer');
    if (resizer) resizer.classList.remove('shown');
    setTimeout(() => { resize(); render(); }, 220);
}

// Drag-to-resize the sidebar (trace panel)
(function setupSidebarResize() {
    const resizer = document.getElementById('sidebar-resizer');
    if (!resizer) return;
    let dragging = false;
    let startX = 0;
    let startW = 0;

    resizer.addEventListener('mousedown', e => {
        if (!sidebar.classList.contains('open')) return;
        dragging = true;
        startX = e.clientX;
        startW = sidebar.offsetWidth;
        sidebar.classList.add('dragging');
        resizer.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
    });

    document.addEventListener('mousemove', e => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        // Resizer is on the LEFT edge of sidebar — moving cursor left = wider sidebar
        let newW = startW - dx;
        const maxW = Math.floor(window.innerWidth * 0.8);
        if (newW < SIDEBAR_MIN_W) newW = SIDEBAR_MIN_W;
        if (newW > maxW) newW = maxW;
        sidebar.style.width = newW + 'px';
        resize();
        render();
    });

    document.addEventListener('mouseup', () => {
        if (!dragging) return;
        dragging = false;
        sidebar.classList.remove('dragging');
        resizer.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        try {
            localStorage.setItem('viz-sidebar-width', String(sidebar.offsetWidth));
        } catch (_) {}
    });
})();

function showEventDetail(ev) {
    openSidebar();
    // Field display order for lus events
    const FIELD_ORDER = ['type', 'time_ms', 'node', 'from', 'to', 'label', 'info',
                         'snr', 'rssi', 'packet_sf', 'rx_sf', 'pkt', 'hex',
                         'emit_type', 'msg', 'data'];
    let html = `<h3>${ev.type}</h3>`;
    html += `<div class="field"><span class="key">time: </span><span class="val">${formatTime(ev.time_ms)}</span></div>`;
    if (ev.type === 'script_emit' && ev.data) {
        const d = ev.data || {};
        if (d.origin !== undefined && d.payload !== undefined) {
            html += `<div class="action-row"><button id="trace-flight-from-event">Trace flight</button></div>`;
        }
    }

    const shown = new Set(['type', 'time_ms']);
    for (const k of FIELD_ORDER) {
        if (k === 'type' || k === 'time_ms') continue;
        if (!(k in ev)) continue;
        shown.add(k);
        const v = ev[k];
        if (k === 'pkt') {
            const val = typeof v === 'number' ? (Number.isInteger(v) ? v : v.toFixed(2)) : String(v);
            html += `<div class="field"><span class="key">${k}: </span><span class="pkt-link" onclick="tracePkt('${escHtml(v)}')">${escHtml(val)}</span></div>`;
        } else if (k === 'data' && v && typeof v === 'object') {
            html += `<div class="field"><span class="key">data:</span></div>`;
            html += `<pre class="json-block">${escHtml(JSON.stringify(normalizeDisplayJson(v), null, 2))}</pre>`;
        } else {
            let val = displayValueForKey(k, v);
            if (val.length > 100) val = val.slice(0, 100) + '\u2026';
            html += `<div class="field"><span class="key">${k}: </span><span class="val">${escHtml(val)}</span></div>`;
        }
    }

    // RF parameter rows (sf, bw_hz, cr) — formatted explicitly
    if (typeof ev.sf === 'number') {
        shown.add('sf');
        html += `<div class="field"><span class="key">SF </span><span class="val">${ev.sf}</span></div>`;
    }
    if (typeof ev.bw_hz === 'number') {
        shown.add('bw_hz');
        html += `<div class="field"><span class="key">BW </span><span class="val">${(ev.bw_hz / 1000).toFixed(0)} kHz</span></div>`;
    }
    if (typeof ev.cr === 'number') {
        shown.add('cr');
        html += `<div class="field"><span class="key">CR </span><span class="val">4/${ev.cr}</span></div>`;
    }

    // Remaining fields as raw JSON footer
    const rest = Object.entries(ev).filter(([k]) => !shown.has(k));
    if (rest.length > 0) {
        html += `<h3>Raw</h3>`;
        for (const [k, v] of rest) {
            let val = typeof v === 'object' ? JSON.stringify(normalizeDisplayJson(v, k)) : displayValueForKey(k, v);
            if (val.length > 200) val = val.slice(0, 200) + '\u2026';
            html += `<div class="field"><span class="key">${escHtml(k)}: </span><span class="val">${escHtml(val)}</span></div>`;
        }
    }

    // Collision explanation box
    if (ev.type === 'collision' && ev.interferer) {
        html += `<div style="margin-top:8px;padding:6px 8px;background:#fef2f2;border:1px solid #fca5a5;border-radius:4px;font-size:11px;color:#991b1b;">`;
        html += `Packet from <b>${escHtml(ev.from)}</b> (SNR ${ev.snr !== undefined ? ev.snr.toFixed(1) : '?'}dB) destroyed by TX from <b>${escHtml(ev.interferer)}</b>.<br>`;
        if (ev.snr_margin !== undefined) html += `Needed ${ev.snr_margin.toFixed(1)}dB more to survive capture.`;
        html += `</div>`;
    }

    sidebarContent.innerHTML = html;
    const traceBtn = document.getElementById('trace-flight-from-event');
    if (traceBtn && ev.data) {
        traceBtn.addEventListener('click', async () => {
            const d = ev.data || {};
            if (d.origin === undefined || d.payload === undefined) return;
            if (!S.traceMode) {
                S.traceMode = true;
                document.getElementById('btn-trace-mode').classList.add('active');
            }
            await traceFlight(d.origin, d.payload);
        });
    }
}

function eventSummary(ev) {
    const parts = [ev.type];
    if (ev.emit_type) parts.push(ev.emit_type);
    if (ev.label) parts.push(ev.label);
    if (ev.from || ev.to) parts.push(`${ev.from || '?'}\u2192${ev.to || '?'}`);
    const d = ev.data || {};
    if (d.reason) parts.push(`reason=${d.reason}`);
    if (d.payload) parts.push(String(d.payload));
    return parts.join(' ');
}

function showEventChooser(events) {
    openSidebar();
    const sorted = [...events].sort((a, b) => {
        const ta = a.time_ms || 0;
        const tb = b.time_ms || 0;
        if (ta !== tb) return ta - tb;
        const aa = `${a.type || ''}:${a.emit_type || ''}:${a.label || ''}`;
        const bb = `${b.type || ''}:${b.emit_type || ''}:${b.label || ''}`;
        return aa.localeCompare(bb);
    });
    let html = `<h3>Events at marker</h3>`;
    html += `<div class="field"><span class="key">count: </span><span class="val">${sorted.length}</span></div>`;
    html += '<table><tr><th>Time</th><th>Type</th><th>Node</th><th>Detail</th></tr>';
    sorted.forEach((ev, idx) => {
        const node = nodeIdToName(ev.node || ev.to || ev.from || '');
        const color = COLORS[ev.type] || '#6b7280';
        html += `<tr class="event-choice" data-event-choice="${idx}" style="color:${color};cursor:pointer">`;
        html += `<td>${formatTime(ev.time_ms)}</td>`;
        html += `<td>${escHtml(ev.emit_type || ev.label || ev.type)}</td>`;
        html += `<td>${escHtml(node || '')}</td>`;
        html += `<td>${escHtml(eventSummary(ev))}</td>`;
        html += `</tr>`;
    });
    html += '</table>';
    html += '<div class="field"><span class="key">hint: </span><span class="val">Click a row to inspect that exact event.</span></div>';
    sidebarContent.innerHTML = html;
    for (const row of sidebarContent.querySelectorAll('[data-event-choice]')) {
        row.addEventListener('click', () => {
            const idx = Number(row.getAttribute('data-event-choice'));
            if (Number.isFinite(idx) && sorted[idx]) showEventDetail(sorted[idx]);
        });
    }
}

function showTraceDetail(pkt, events) {
    openSidebar();
    const sorted = [...events].sort((a, b) => a.time_ms - b.time_ms);

    let html = `<h3>Trace: ${escHtml(pkt)}</h3>`;
    html += `<div style="margin-bottom:6px"><button onclick="clearTrace(); closeSidebar();" style="background:#e5e7eb;color:#374151;border:1px solid #d1d5db;padding:3px 10px;border-radius:3px;cursor:pointer;font-family:inherit;font-size:11px;">Clear trace</button></div>`;

    if (sorted.length === 0) {
        html += '<div style="color:#9ca3af;margin-top:8px">No events with this pkt hash in the current viewport. Pan or zoom to load more events, then click again.</div>';
        sidebarContent.innerHTML = html;
        return;
    }

    // Summary
    const counts = {};
    for (const ev of sorted) { counts[ev.type] = (counts[ev.type] || 0) + 1; }
    html += `<div class="field"><span class="key">events: </span><span class="val">${Object.entries(counts).map(([t,c]) => `${c} ${t}`).join(', ')}</span></div>`;

    // Event table
    html += '<table><tr><th>Time</th><th>Type</th><th>Node</th><th>Detail</th></tr>';
    for (const ev of sorted) {
        const evNode = ev.node || ev.to || '';
        let detail = '';
        if (ev.from && ev.to) detail += `${ev.from}\u2192${ev.to}`;
        else if (ev.from) detail += ev.from;
        if (ev.snr !== undefined) detail += ` snr=${ev.snr.toFixed(1)}`;
        if (ev.airtime_ms) detail += ` ${ev.airtime_ms}ms`;

        const color = COLORS[ev.type] || '#6b7280';
        const nodeHtml = evNode ? `<span class="pkt-link" data-jump-node="${escHtml(evNode)}" data-jump-time="${ev.time_ms}">${escHtml(evNode)}</span>` : '';
        html += `<tr style="color:${color}"><td>${formatTime(ev.time_ms)}</td><td>${ev.type}</td><td>${nodeHtml}</td><td>${escHtml(detail)}</td></tr>`;
    }
    html += '</table>';

    sidebarContent.innerHTML = html;

    // Attach click handlers for jump links
    sidebarContent.querySelectorAll('[data-jump-node]').forEach(el => {
        el.addEventListener('click', () => {
            jumpToEvent(el.dataset.jumpNode, parseFloat(el.dataset.jumpTime));
        });
    });
}


function showNodeDetail(name) {
    openSidebar();
    const meta = S.meta.nodes.find(n => n.name === name);
    const stats = (S.meta.stats || []).find(s => s.node === name);

    let html = `<h3>${escHtml(name)}</h3>`;
    if (meta) {
        html += '<h3>Identity</h3>';
        html = addField(html, 'runtime id', runtimeIdForName(name));
        html = addField(html, 'node id', meta.node_id);
        html = addField(html, 'key hash32', hex32(meta.key_hash32));
        html = addField(html, 'layer', meta.layer_id);
        html = addField(html, 'leaf', meta.leaf_id);
        html = addField(html, 'joined', meta.joined);
        html = addField(html, 'routing SF', meta.routing_sf);
        html = addField(html, 'allowed SF bitmap', meta.allowed_sf_bitmap);
        html = addField(html, 'mobile', meta.is_mobile);
        html = addField(html, 'gateway', meta.is_gateway);
        if (meta.gateway_layers !== undefined && meta.gateway_layers !== null) {
            const layers = Array.isArray(meta.gateway_layers)
                ? meta.gateway_layers.join(', ')
                : JSON.stringify(meta.gateway_layers);
            html = addField(html, 'gateway layers', layers);
        }
    }
    if (meta && meta.lat) {
        html += `<div class="field"><span class="key">location: </span><span class="val">${meta.lat.toFixed(5)}, ${meta.lon.toFixed(5)}</span></div>`;
    }
    html += `<div class="field"><span class="key">role: </span><span class="val">${meta ? meta.role || 'unknown' : 'unknown'}</span></div>`;

    if (stats) {
        html += '<h3>Message stats</h3>';
        html += `<div class="field"><span class="key">sent flood: </span><span class="val">${stats.sent_flood || 0}</span></div>`;
        html += `<div class="field"><span class="key">sent direct: </span><span class="val">${stats.sent_direct || 0}</span></div>`;
        html += `<div class="field"><span class="key">recv direct: </span><span class="val">${stats.recv_direct || 0}</span></div>`;
        html += `<div class="field"><span class="key">recv group: </span><span class="val">${stats.recv_group || 0}</span></div>`;
        if (stats.recv_direct_by_sender) {
            html += '<h3>Received from</h3>';
            for (const [sender, count] of Object.entries(stats.recv_direct_by_sender)) {
                html += `<div class="field"><span class="key">${escHtml(sender)}: </span><span class="val">${count}</span></div>`;
            }
        }
    }

    // Repeater stats (core/radio/packets)
    const rStats = (S.meta.repeater_stats || []).filter(s => s.node === name && s.stats_type);
    if (rStats.length > 0) {
        const radio = rStats.find(s => s.stats_type === 'radio');
        if (radio && radio.data) {
            html += '<h3>Radio</h3>';
            const d = radio.data;
            html += `<div class="field"><span class="key">Last RSSI: </span><span class="val">${d.last_rssi} dBm</span></div>`;
            html += `<div class="field"><span class="key">Last SNR: </span><span class="val">${d.last_snr.toFixed(2)} dB</span></div>`;
            html += `<div class="field"><span class="key">TX airtime: </span><span class="val">${d.tx_air_secs}s</span></div>`;
            html += `<div class="field"><span class="key">RX airtime: </span><span class="val">${d.rx_air_secs}s</span></div>`;
        }
        const pkts = rStats.find(s => s.stats_type === 'packets');
        if (pkts && pkts.data) {
            html += '<h3>Packets</h3>';
            const d = pkts.data;
            html += `<div class="field"><span class="key">Received: </span><span class="val">${d.recv}</span></div>`;
            html += `<div class="field"><span class="key">Sent: </span><span class="val">${d.sent}</span></div>`;
            html += `<div class="field"><span class="key">Flood TX/RX: </span><span class="val">${d.flood_tx} / ${d.flood_rx}</span></div>`;
            html += `<div class="field"><span class="key">Direct TX/RX: </span><span class="val">${d.direct_tx} / ${d.direct_rx}</span></div>`;
            if (d.recv_errors > 0)
                html += `<div class="field"><span class="key">Errors: </span><span class="val" style="color:#dc2626">${d.recv_errors}</span></div>`;
        }
        const core = rStats.find(s => s.stats_type === 'core');
        if (core && core.data) {
            html += '<h3>Core</h3>';
            const d = core.data;
            html += `<div class="field"><span class="key">Uptime: </span><span class="val">${d.uptime_secs}s</span></div>`;
            html += `<div class="field"><span class="key">Queue: </span><span class="val">${d.queue_len}</span></div>`;
            if (d.errors > 0)
                html += `<div class="field"><span class="key">Errors: </span><span class="val" style="color:#dc2626">${d.errors}</span></div>`;
        }
    }

    sidebarContent.innerHTML = html;
}

function escHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── Event-type filter ──────────────────────────────────────────
function parseTypeFilter(raw) {
    const allow = new Set();
    const deny = new Set();
    let hasAllow = false;
    for (const tok of (raw || '').split(',')) {
        const t = tok.trim();
        if (!t) continue;
        if (t.startsWith('!')) {
            const name = t.slice(1).trim();
            if (name) deny.add(name);
        } else {
            allow.add(t);
            hasAllow = true;
        }
    }
    S.typeFilterAllow = hasAllow ? allow : null;
    S.typeFilterDeny = deny;
}
function eventTypeAllowed(etype) {
    if (S.typeFilterDeny.has(etype)) return false;
    if (S.typeFilterAllow && !S.typeFilterAllow.has(etype)) return false;
    return true;
}
document.getElementById('type-filter').addEventListener('input', (e) => {
    parseTypeFilter(e.target.value);
    render();
});

// ── Delivery breakdown panel ───────────────────────────────────
let _dmBreakdownCache = null;

async function loadDeliveryBreakdown() {
    if (!SIM_ID) {
        openSidebar();
        sidebarContent.innerHTML =
            '<div class="event-detail"><h3>Delivery</h3>' +
            '<div class="field">Only available for completed runs.</div></div>';
        return;
    }
    if (_dmBreakdownCache) { renderDeliveryPanel(_dmBreakdownCache); return; }
    openSidebar();
    sidebarContent.innerHTML = '<div class="event-detail"><h3>Delivery</h3>' +
        '<div class="field">Loading…</div></div>';
    try {
        const r = await fetch(`/api/sims/${SIM_ID}/dm_breakdown`);
        if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
        _dmBreakdownCache = await r.json();
        renderDeliveryPanel(_dmBreakdownCache);
    } catch (e) {
        sidebarContent.innerHTML = '<div class="event-detail"><h3>Delivery</h3>' +
            `<div class="field" style="color:#dc2626">Failed: ${escHtml(String(e))}</div></div>`;
    }
}

// "name(id)" -> integer id (for traceFlight). null if no id suffix.
function _nodeIdFromLabel(label) {
    const m = /\((\d+)\)\s*$/.exec(label || '');
    return m ? parseInt(m[1], 10) : null;
}

function renderDeliveryPanel(data) {
    openSidebar();
    let html = '<div class="event-detail"><h3>Delivery</h3>';

    const dm = data.summary || [];
    html += '<h4>DM</h4>';
    if (!dm.length) {
        html += '<div class="field">No configured DM pairs.</div>';
    } else {
        html += '<table><tr><th>pair</th><th>sent</th><th>arr</th>' +
                '<th>ack</th><th>give</th><th>hops</th></tr>';
        dm.forEach((row, i) => {
            const hops = row.mean_hops == null ? '–' : row.mean_hops.toFixed(1);
            html += `<tr class="dm-row" data-dm="${i}" style="cursor:pointer">` +
                `<td>${escHtml(row.origin)}→${escHtml(row.dst)}</td>` +
                `<td>${row.sent}</td><td>${row.arrived}</td>` +
                `<td>${row.acked}</td><td>${row.giveup}</td><td>${hops}</td></tr>`;
        });
        html += '</table>';
    }

    const ch = data.channels || [];
    html += '<h4>Channels</h4>';
    if (!ch.length) {
        html += '<div class="field">No channel posts.</div>';
    } else {
        html += '<table><tr><th>post</th><th>reach</th>' +
                '<th>exp</th><th>leaks</th><th>@ms</th></tr>';
        ch.forEach((row, i) => {
            const at = row.sent_at_ms == null ? '–' : formatTime(row.sent_at_ms);
            html += `<tr class="ch-row" data-ch="${i}" style="cursor:pointer">` +
                `<td>${escHtml(String(row.payload))}</td>` +
                `<td>${row.reach}</td><td>${row.expected}</td>` +
                `<td>${row.leaks}</td><td>${at}</td></tr>`;
        });
        html += '</table>';
    }
    html += '</div>';
    sidebarContent.innerHTML = html;

    // DM row → frame the message's time window, then flight-trace it.
    // Fitting first loads the flight's events into the viewport cache so
    // traceFlight() can match them and drawFlightPolyline() can chain them.
    sidebarContent.querySelectorAll('.dm-row[data-dm]').forEach(tr => {
        tr.addEventListener('click', async () => {
            const summaryRow = dm[+tr.dataset.dm];
            const msg = (data.messages || []).find(m =>
                m.origin === summaryRow.origin && m.dst === summaryRow.dst);
            const originId = _nodeIdFromLabel(summaryRow.origin);
            const payload = msg ? msg.payload : null;
            if (msg) {
                const ts = (msg.events || [])
                    .map(e => e.t_ms).filter(t => t != null);
                for (const f of ['enqueued_ms', 'arrived_ms', 'ack_ms', 'giveup_ms',
                                 'arrival_at_target_ms']) {
                    if (msg[f] != null) ts.push(msg[f]);
                }
                if (ts.length) await fitViewportTo(Math.min(...ts), Math.max(...ts));
            }
            if (originId != null && payload != null) await traceFlight(originId, payload);
        });
    });
    // Channel row → center viewport on the post time.
    sidebarContent.querySelectorAll('.ch-row[data-ch]').forEach(tr => {
        tr.addEventListener('click', () => {
            const at = ch[+tr.dataset.ch].sent_at_ms;
            if (at != null) centerViewportOn(at);
        });
    });
}

document.getElementById('btn-delivery').addEventListener('click', loadDeliveryBreakdown);

// Parse a time string into milliseconds. Accepts: "12345" (ms),
// "30s" (seconds), "1:30" or "1:30.5" (m:ss). Returns null on failure.
function parseGotoTime(raw) {
    if (!raw) return null;
    const s = raw.trim();
    if (!s) return null;
    let m;
    if ((m = s.match(/^(\d+):(\d+(?:\.\d+)?)$/))) {
        return (parseInt(m[1], 10) * 60 + parseFloat(m[2])) * 1000;
    }
    if ((m = s.match(/^(\d+(?:\.\d+)?)\s*s$/i))) {
        return parseFloat(m[1]) * 1000;
    }
    if ((m = s.match(/^(\d+(?:\.\d+)?)\s*ms?$/i))) {
        return parseFloat(m[1]);
    }
    const n = parseFloat(s);
    return Number.isFinite(n) ? n : null;
}

async function centerViewportOn(target) {
    followMode = false; updateFollowIndicator();
    const span = S.viewTo - S.viewFrom;
    S.viewFrom = target - span / 2;
    S.viewTo = target + span / 2;
    clampViewport();
    syncScrollbar();
    await loadViewport();
    render();
}

// Frame [fromMs, toMs] in the viewport with padding. A 500ms floor keeps
// instantaneous flights from zooming in absurdly far.
async function fitViewportTo(fromMs, toMs) {
    if (toMs < fromMs) { const t = fromMs; fromMs = toMs; toMs = t; }
    let span = toMs - fromMs;
    if (span < 500) { const mid = (fromMs + toMs) / 2; fromMs = mid - 250; toMs = mid + 250; span = 500; }
    const pad = span * 0.15;
    followMode = false; updateFollowIndicator();
    S.viewFrom = fromMs - pad;
    S.viewTo = toMs + pad;
    clampViewport();
    syncScrollbar();
    await loadViewport();
    render();
}

async function gotoTime() {
    const input = document.getElementById('goto-ms');
    const target = parseGotoTime(input.value);
    if (target === null) {
        input.style.borderColor = '#dc2626';
        setTimeout(() => { input.style.borderColor = ''; }, 800);
        return;
    }
    await centerViewportOn(target);
}

document.getElementById('btn-goto').addEventListener('click', gotoTime);
document.getElementById('goto-ms').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); gotoTime(); }
});

window.addEventListener('resize', () => { resize(); render(); });

// ── Scrollbar ──────────────────────────────────────────────────
const timeSlider = document.getElementById('time-slider');
const scrollFrom = document.getElementById('scroll-from');
const scrollTo = document.getElementById('scroll-to');

function syncScrollbar() {
    if (!S.meta) return;
    const totalSpan = S.meta.time_max - S.meta.time_min;
    if (totalSpan <= 0) return;
    const viewSpan = S.viewTo - S.viewFrom;
    // Slider represents the center of the viewport as fraction of total range
    const center = (S.viewFrom + S.viewTo) / 2;
    const fraction = (center - S.meta.time_min) / totalSpan;
    timeSlider.value = Math.round(fraction * 1000);
    scrollFrom.textContent = formatTime(S.viewFrom);
    scrollTo.textContent = formatTime(S.viewTo);
}

let sliderDragging = false;
timeSlider.addEventListener('input', async () => {
    sliderDragging = true;
    const fraction = timeSlider.value / 1000;
    const totalSpan = S.meta.time_max - S.meta.time_min;
    const viewSpan = S.viewTo - S.viewFrom;
    const center = S.meta.time_min + fraction * totalSpan;
    S.viewFrom = center - viewSpan / 2;
    S.viewTo = center + viewSpan / 2;
    clampViewport();
    await loadViewport();
    render();
});
timeSlider.addEventListener('mouseup', () => { sliderDragging = false; });
timeSlider.addEventListener('touchend', () => { sliderDragging = false; });

document.getElementById('btn-zoom-in').addEventListener('click', async () => {
    const center = (S.viewFrom + S.viewTo) / 2;
    const newSpan = Math.max(100, (S.viewTo - S.viewFrom) / 2);
    S.viewFrom = center - newSpan / 2;
    S.viewTo = center + newSpan / 2;
    await loadViewport();
    render();
});

document.getElementById('btn-zoom-out').addEventListener('click', async () => {
    const center = (S.viewFrom + S.viewTo) / 2;
    const totalSpan = S.meta.time_max - S.meta.time_min;
    const newSpan = Math.min(totalSpan || 10000, (S.viewTo - S.viewFrom) * 2);
    S.viewFrom = center - newSpan / 2;
    S.viewTo = center + newSpan / 2;
    clampViewport();
    await loadViewport();
    render();
});

// ── Keyboard shortcuts ─────────────────────────────────────────
document.addEventListener('keydown', async (e) => {
    const span = S.viewTo - S.viewFrom;
    if (e.key === 'Escape') {
        clearTrace();
        closeSidebar();
    } else if (e.key === 'f') {
        S.viewFrom = S.meta.time_min;
        S.viewTo = S.meta.time_max;
        await loadViewport();
        render();
    } else if (e.key === 'ArrowRight') {
        const shift = span * 0.2;
        S.viewFrom += shift;
        S.viewTo += shift;
        clampViewport();
        await loadViewport();
        render();
    } else if (e.key === 'ArrowLeft') {
        const shift = span * 0.2;
        S.viewFrom -= shift;
        S.viewTo -= shift;
        clampViewport();
        await loadViewport();
        render();
    } else if (e.key === 't') {
        S.traceMode = !S.traceMode;
        document.getElementById('btn-trace-mode').classList.toggle('active', S.traceMode);
        if (!S.traceMode) clearTrace();
    } else if (e.key === 'r') {
        S.raysMode = !S.raysMode;
        document.getElementById('btn-rays').classList.toggle('active', S.raysMode);
        render();
    }
});
